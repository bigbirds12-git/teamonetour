<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        body { margin:0; font-family:Arial; display:flex; }
        .sidebar {
            width:220px; background:#1f2937; color:white; padding:20px;
            height:100vh; box-sizing:border-box;
        }
        .sidebar a {
            display:block; color:white; padding:10px 0; cursor:pointer;
        }
        .main {
            flex:1; padding:20px;
        }
        .card {
            background:white; padding:20px; border-radius:8px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
            margin-bottom:20px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Admin Panel</h2>
    <a onclick="navigate('dashboard')">Dashboard</a>
    <a onclick="navigate('places')">관광지 관리</a>
    <a onclick="navigate('guides')">가이드 승인/관리</a>
    <a onclick="navigate('bookings')">예약 전체 관리</a>
    <a onclick="navigate('system')">시스템 설정</a>
    <a onclick="logout()">Logout</a>
</div>

<!-- Main SPA Container -->
<div class="main" id="app"></div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    /* ---------------- Firebase Init ---------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    /* ---------------- 로그인 체크 ---------------- */
    onAuthStateChanged(auth, user => {
        if (!user) {
            window.location.href = "admin-login.html";
            return;
        }
        navigate("dashboard");
    });

    /* ---------------- SPA ROUTER ---------------- */
    window.navigate = function(page) {
        if (page === "dashboard") loadDashboard();
        if (page === "places") loadPlaces();
        if (page === "guides") loadGuides();
        if (page === "bookings") loadBookings();
        if (page === "system") loadSystem();
    };

    /* ---------------- Dashboard ---------------- */
    window.loadDashboard = function() {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>운영자 대시보드</h2>
                <p>플랫폼 전체 운영 상태를 확인할 수 있습니다.</p>
            </div>
        `;
    };

    /* ---------------- 관광지 관리 ---------------- */
    window.loadPlaces = async function() {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>관광지 등록</h2>
                <input id="placeName" placeholder="이름"><br><br>
                <input id="placeAddress" placeholder="주소"><br><br>
                <button onclick="submitPlace()">등록</button>
                <div id="placeStatus"></div>
            </div>

            <div class="card">
                <h2>관광지 목록</h2>
                <div id="placeList">불러오는 중...</div>
            </div>
        `;
        loadPlaceList();
    };

    window.submitPlace = async function() {
        const name = document.getElementById("placeName").value;
        const address = document.getElementById("placeAddress").value;
        const status = document.getElementById("placeStatus");

        await addDoc(collection(db, "places"), { name, address });
        status.innerText = "등록 완료!";
        loadPlaceList();
    };

    window.loadPlaceList = async function() {
        const listDiv = document.getElementById("placeList");
        listDiv.innerHTML = "";

        const querySnapshot = await getDocs(collection(db, "places"));
        querySnapshot.forEach(docSnap => {
            const p = docSnap.data();
            const id = docSnap.id;

            listDiv.innerHTML += `
                <div style="padding:10px; border-bottom:1px solid #ddd;">
                    <strong>${p.name}</strong><br>
                    ${p.address}<br><br>
                    <button onclick="deletePlace('${id}')">삭제</button>
                </div>
            `;
        });
    };

    window.deletePlace = async function(id) {
        await deleteDoc(doc(db, "places", id));
        loadPlaceList();
    };

    /* ---------------- 기타 메뉴 ---------------- */
    window.loadGuides = function() {
        document.getElementById("app").innerHTML = `
            <div class="card"><h2>가이드 승인/관리</h2></div>
        `;
    };

    window.loadBookings = function() {
        document.getElementById("app").innerHTML = `
            <div class="card"><h2>예약 전체 관리</h2></div>
        `;
    };

    window.loadSystem = function() {
        document.getElementById("app").innerHTML = `
            <div class="card"><h2>시스템 설정</h2></div>
        `;
    };

    /* ---------------- Logout ---------------- */
    window.logout = function() {
        signOut(auth);
    };
</script>

</body>
</html>
