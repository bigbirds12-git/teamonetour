<script>
firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "indexforguide.html"; // 로그인 안 했으면 차단
    }
});
</script>


<button onclick="logout()">Logout</button>

<script>
function logout() {
    firebase.auth().signOut().then(() => {
        window.location.href = "indexforguide.html";
    });
}
</script>
