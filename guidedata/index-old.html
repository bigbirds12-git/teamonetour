<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Dashboard (Conversational UI)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {margin: 0; font-family: 'Inter', sans-serif; background: #f5f7fa; display: flex;}

/* Sidebar */
.sidebar {width: 240px; height: 100vh; background: #1f2937; color: white; padding: 30px 20px; position: fixed; left: 0; top: 0;}
.sidebar h2 {font-size: 20px; margin-bottom: 30px;}
.sidebar a {display: block; color: #d1d5db; text-decoration: none; padding: 12px 0; font-size: 16px; font-weight: 500; cursor: pointer;}
.sidebar a:hover {color: #ffffff;}

/* Main Content */
.main {margin-left: 260px; padding: 40px; width: calc(100% - 260px - 350px);}

/* Chat Panel */
.chat-panel {width: 350px; height: 100vh; background: #ffffff; border-left: 1px solid #ddd; position: fixed; right: 0; top: 0; padding: 20px; display: flex; flex-direction: column;}
.chat-panel h3 {margin-bottom: 15px;}
.chat-box {flex: 1; overflow-y: auto; padding-right: 10px;}
.chat-input {display: flex; margin-top: 15px;}
.chat-input input {flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc;}
.chat-input button {margin-left: 10px; padding: 12px 18px; background: #0078ff; color: white; border: none; border-radius: 8px; cursor: pointer;}

/* Dashboard Cards */
.card {background: white; padding: 30px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); margin-bottom: 30px;}
.card h2 {margin-bottom: 20px; font-size: 22px;}

.info-row {margin-bottom: 10px; font-size: 16px;}
    
/* Profile Box */
.reg-box {width: 900px; max-width: 100%; background: white; padding: 40px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);}

input, textarea, select {width: 100%; padding: 14px; margin-top: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;}
textarea {height: 120px;}
button { width: 100%; padding: 14px; margin-top: 25px; background: #0078ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px;}
button:hover {background: #005fcc;}

.quick-links a {display: inline-block; margin-right: 12px; padding: 10px 16px; background: #0078ff; color: white; border-radius: 8px; text-decoration: none; font-size: 14px;}
.quick-links a:hover {background: #005fcc;}

#msg {color: red; margin-top: 10px;}
    
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a onclick="navigate('dashboard')">Home</a>
    <a onclick="navigate('schedule')">My Schedule</a>
    <a href="/guidedata/bookings.html">Bookings</a>
    <a href="/guidedata/messages.html">Messages</a>
    <a href="/guidedata/revenue.html">Revenue</a>
    <a onclick="navigate('profile')">Edit Profile</a>
</div>

<!-- Main SPA Container -->
<div class="main" id="app"></div>

<!-- Chat Panel -->
<div class="chat-panel">
    <h3>AI Assistant</h3>
    <div class="chat-box" id="chatBox"></div>

    <div class="chat-input">
        <input id="chatInput" placeholder="예: 내 프로필 보여줘">
        <button onclick="sendChat()">Send</button>
    </div>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

let currentUser = null;

onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location.href = "guidelogin.html";
        return;
    }
    currentUser = user;
    
    // ✅ 처음 한 번만 네비게이트
    if (!window._initialized) {
        window._initialized = true;
        navigate("dashboard");
    }
});

/* ---------------- SPA ROUTER ---------------- */
window.navigate = function(page) {
    if (page === "dashboard") loadDashboardPage();
    else if (page === "schedule") loadSchedulePage();
    else if (page === "profile") loadProfilePage();
    else if (page === "bookings") window.location.href = "/guidedata/bookings.html";
    else if (page === "messages") window.location.href = "/guidedata/messages.html";
    else if (page === "revenue") window.location.href = "/guidedata/revenue.html";
};

/* ---------------- CHAT COMMANDS ---------------- */
function sendChat() {
    // ✅ DOM 요소 가져오기
    const chatInput = document.getElementById('chatInput');
    const chatBox = document.getElementById('chatBox');
    
    if (!chatInput || !chatBox) {
        console.error('Chat elements not found');
        return;
    }
    
    const input = chatInput.value.trim();
    if (!input) return;

    chatBox.innerHTML += `<p><strong>You:</strong> ${input}</p>`;
    chatInput.value = "";
    
    // 자동 스크롤
    chatBox.scrollTop = chatBox.scrollHeight;

    // ✅ 명령어 처리
    const lowerInput = input.toLowerCase();
    if (lowerInput.includes('프로필') || lowerInput.includes('profile')) {
        navigate("profile");
    } else if (lowerInput.includes('일정') || lowerInput.includes('schedule')) {
        navigate("schedule");
    } else if (lowerInput.includes('홈') || lowerInput.includes('대시보드') || lowerInput.includes('home')) {
        navigate("dashboard");
    } else {
        chatBox.innerHTML += `<p><strong>AI:</strong> 이해했어요. 곧 더 많은 기능을 추가할게요.</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

/* ---------------- DASHBOARD ---------------- */
async function loadDashboardPage() {
    // ✅ currentUser 체크
    if (!currentUser) {
        window.location.href = "guidelogin.html";
        return;
    }
    
    try {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);
        const g = snap.exists() ? snap.data() : {};

        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>Guide Information</h2>
                <div class="info-row"><strong>Name:</strong> ${g.name || ""}</div>
                <div class="info-row"><strong>Phone:</strong> ${g.phone || ""}</div>
                <div class="info-row"><strong>Nationality:</strong> ${g.nationality || ""}</div>
                <div class="info-row"><strong>Gender:</strong> ${g.gender || ""}</div>
                <div class="info-row"><strong>Languages:</strong> ${(g.languages || []).join(", ")}</div>
                <div class="info-row"><strong>Specialties:</strong> ${(g.specialties || []).join(", ")}</div>
                <div class="info-row"><strong>Regions:</strong> ${(g.regions || []).join(", ")}</div>
            </div>

            <div class="card">
                <h2>Today's Schedule</h2>
                <p>오늘 일정이 없습니다.</p>
            </div>

            <div class="card">
                <h2>Quick Actions</h2>
                <div class="quick-links">
                    <a onclick="navigate('schedule')">일정 관리</a>
                    <a onclick="navigate('profile')">프로필 수정</a>
                    <a href="/guidedata/bookings.html">예약 관리</a>
                </div>
            </div>
        `;
    } catch (error) {
        console.error('Dashboard load error:', error);
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>오류 발생</h2>
                <p>데이터를 불러오는 중 문제가 발생했습니다.</p>
                <button onclick="loadDashboardPage()">다시 시도</button>
            </div>
        `;
    }
}

/* ---------------- SCHEDULE ---------------- */
function loadSchedulePage() {
    document.getElementById("app").innerHTML = `
        <div class="card">
            <h2>Schedule 화면 준비 중</h2>
            <p>일정 기능은 다음 단계에서 완성해드릴게요.</p>
        </div>
    `;
}

/* ---------------- PROFILE 화면 ---------------- */

/* ---------------- 데이터 로딩 ---------------- */
async function loadProfile() {
    // ✅ msg 요소 가져오기
    const msg = document.getElementById('msg');
    if (!msg) {
        console.error('Message element not found');
        return;
    }
    
    if (!currentUser) {
        msg.innerText = "로그인이 필요합니다.";
        return;
    }
    
    try {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            msg.innerText = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();
        
        // ✅ 각 DOM 요소를 개별적으로 가져오기
        const name = document.getElementById('name');
        const phone = document.getElementById('phone');
        const nationality = document.getElementById('nationality');
        const gender = document.getElementById('gender');
        const experience = document.getElementById('experience');
        const price_hour = document.getElementById('price_hour');
        const price_day = document.getElementById('price_day');
        const bio = document.getElementById('bio');
        const languages = document.getElementById('languages');
        const specialties = document.getElementById('specialties');
        const regions = document.getElementById('regions');

        // ✅ null 체크 후 값 할당
        if (name) name.value = g.name || "";
        if (phone) phone.value = g.phone || "";
        if (nationality) nationality.value = g.nationality || "South Korea";
        if (gender) gender.value = g.gender || "남성";
        if (experience) experience.value = g.experience || "1";
        if (price_hour) price_hour.value = g.price_hour || "";
        if (price_day) price_day.value = g.price_day || "";
        if (bio) bio.value = g.bio || "";

        if (languages && g.languages) {
            Array.from(languages.options).forEach(opt => {
                opt.selected = g.languages.includes(opt.value);
            });
        }

        if (specialties && g.specialties) {
            Array.from(specialties.options).forEach(opt => {
                opt.selected = g.specialties.includes(opt.value);
            });
        }

        if (regions && g.regions) {
            Array.from(regions.options).forEach(opt => {
                opt.selected = g.regions.includes(opt.value);
            });
        }
        
        msg.innerText = ""; // 성공 시 메시지 초기화
        
    } catch (error) {
        console.error('Profile load error:', error);
        msg.innerText = "데이터 로딩 중 오류가 발생했습니다.";
    }
}

/* ---------------- 데이터 업데이트 ---------------- */
window.updateGuide = async function() {
    // ✅ msg 요소 가져오기
    const msg = document.getElementById('msg');
    if (!msg) {
        console.error('Message element not found');
        return;
    }
    
    if (!currentUser) {
        msg.innerText = "로그인이 필요합니다.";
        return;
    }
    
    // ✅ DOM 요소 가져오기
    const name = document.getElementById('name');
    const phone = document.getElementById('phone');
    const nationality = document.getElementById('nationality');
    const gender = document.getElementById('gender');
    const experience = document.getElementById('experience');
    const price_hour = document.getElementById('price_hour');
    const price_day = document.getElementById('price_day');
    const bio = document.getElementById('bio');
    const languages = document.getElementById('languages');
    const specialties = document.getElementById('specialties');
    const regions = document.getElementById('regions');

    // ✅ null 체크
    if (!languages || !specialties || !regions) {
        msg.innerText = "필수 입력 항목이 없습니다.";
        return;
    }

    const specialtiesArr = Array.from(specialties.selectedOptions).map(opt => opt.value);
    const regionsArr = Array.from(regions.selectedOptions).map(opt => opt.value);
    const languagesArr = Array.from(languages.selectedOptions).map(opt => opt.value);

    try {
        await updateDoc(doc(db, "guides", currentUser.uid), {
            name: name ? name.value : "",
            phone: phone ? phone.value : "",
            nationality: nationality ? nationality.value : "",
            gender: gender ? gender.value : "",
            languages: languagesArr,
            experience: experience ? experience.value : "",
            specialties: specialtiesArr,
            regions: regionsArr,
            price_hour: price_hour ? price_hour.value : "",
            price_day: price_day ? price_day.value : "",
            bio: bio ? bio.value : ""
        });

        msg.innerText = "✅ 정보가 성공적으로 수정되었습니다.";
        msg.style.color = "green";
        
        // ✅ 1.5초 후 대시보드로 이동
        setTimeout(() => {
            navigate("dashboard");
        }, 1500);
        
    } catch (err) {
        console.error('Update error:', err);
        msg.innerText = "❌ 오류: " + err.message;
        msg.style.color = "red";
    }
};
