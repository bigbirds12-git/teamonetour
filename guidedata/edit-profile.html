<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Edit Guide Profile (SPA)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f2937;
    color: white;
    padding: 30px 20px;
    position: fixed;
    left: 0;
    top: 0;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}

.sidebar a:hover {
    color: #ffffff;
}

/* Main Content */
.main {
    margin-left: 260px;
    padding: 40px;
    width: 100%;
}

.reg-box {
    width: 480px;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.reg-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

textarea {
    height: 100px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #005fcc;
}

#msg {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a onclick="navigate('dashboard')">Home</a>
    <a onclick="navigate('schedule')">My Schedule</a>
    <a onclick="navigate('bookings')">Bookings</a>
    <a onclick="navigate('messages')">Messages</a>
    <a onclick="navigate('revenue')">Revenue</a>
    <a onclick="navigate('profile')">Edit Profile</a>
</div>

<!-- Main SPA Container -->
<div class="main" id="app">
    <!-- SPA 화면이 여기에 로드됨 -->
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    let currentUser = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "guidelogin.html";
            return;
        }
        currentUser = user;
        navigate("profile"); // 기본 화면
    });

    /* ---------------- SPA ROUTER ---------------- */
    function navigate(page) {
        if (page === "profile") loadProfilePage();
        else document.getElementById("app").innerHTML = `<h2>${page} 화면 준비 중</h2>`;
    }

    /* ---------------- PROFILE 화면 ---------------- */
    async function loadProfilePage() {
        document.getElementById("app").innerHTML = `
            <div class="reg-box">
                <h2>Edit Profile</h2>

                <input id="name" placeholder="이름 또는 닉네임">
                <input id="phone" placeholder="전화번호">

                <label style="margin-top:15px;">국적</label>
                <select id="nationality">
                    <option value="South Korea">South Korea</option>
                    <option value="UAE">UAE</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                    <option value="India">India</option>
                    <option value="Philippines">Philippines</option>
                    <option value="Russia">Russia</option>
                    <option value="UK">UK</option>
                    <option value="USA">USA</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Other">Other</option>
                </select>

                <label style="margin-top:15px;">성별</label>
                <select id="gender">
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                    <option value="기타">기타</option>
                </select>

                <label style="margin-top:15px;">가능 언어</label>
                <select id="languages" multiple>
                    <option value="Korean">Korean</option>
                    <option value="English">English</option>
                    <option value="Arabic">Arabic</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Russian">Russian</option>
                    <option value="Filipino">Filipino</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                </select>

                <label style="margin-top:15px;">경력 (Years of Experience)</label>
                <select id="experience">
                    <option value="1">1년</option>
                    <option value="2">2년</option>
                    <option value="3">3년</option>
                    <option value="5">5년</option>
                    <option value="7">7년</option>
                    <option value="10">10년</option>
                    <option value="15">15년</option>
                    <option value="20">20년</option>
                </select>

                <label style="margin-top:15px;">전문 분야</label>
                <select id="specialties" multiple>
                    <option value="문화/예술">문화/예술</option>
                    <option value="역사">역사</option>
                    <option value="사막 사파리">사막 사파리</option>
                    <option value="사진 촬영">사진 촬영</option>
                    <option value="쇼핑">쇼핑</option>
                    <option value="미식">미식</option>
                    <option value="VIP 의전">VIP 의전</option>
                    <option value="가족 여행">가족 여행</option>
                    <option value="비즈니스 출장">비즈니스 출장</option>
                </select>

                <label style="margin-top:15px;">활동 지역</label>
                <select id="regions" multiple>
                    <option value="Dubai Marina">Dubai Marina</option>
                    <option value="Downtown Dubai">Downtown Dubai</option>
                    <option value="Deira">Deira</option>
                    <option value="Jumeirah">Jumeirah</option>
                    <option value="Abu Dhabi">Abu Dhabi</option>
                    <option value="Sharjah">Sharjah</option>
                </select>

                <input id="price_hour" placeholder="시간당 요금 (AED)">
                <input id="price_day" placeholder="하루 요금 (AED)">

                <textarea id="bio" placeholder="가이드 소개"></textarea>

                <button onclick="updateGuide()">정보 수정</button>
                <p id="msg"></p>
            </div>
        `;

        loadProfile();
    }

    /* ---------------- 데이터 로딩 ---------------- */
    async function loadProfile() {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            msg.innerText = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();

        name.value = g.name || "";
        phone.value = g.phone || "";
        nationality.value = g.nationality || "South Korea";
        gender.value = g.gender || "남성";
        experience.value = g.experience || "1";
        price_hour.value = g.price_hour || "";
        price_day.value = g.price_day || "";
        bio.value = g.bio || "";

        Array.from(languages.options).forEach(opt => {
            if (g.languages?.includes(opt.value)) opt.selected = true;
        });

        Array.from(specialties.options).forEach(opt => {
            if (g.specialties?.includes(opt.value)) opt.selected = true;
        });

        Array.from(regions.options).forEach(opt => {
            if (g.regions?.includes(opt.value)) opt.selected = true;
        });
    }

    /* ---------------- 데이터 업데이트 ---------------- */
    window.updateGuide = async function() {
        const specialtiesArr = Array.from(specialties.selectedOptions).map(opt => opt.value);
        const regionsArr = Array.from(regions.selectedOptions).map(opt => opt.value);
        const languagesArr = Array.from(languages.selectedOptions).map(opt => opt.value);

        try {
            await updateDoc(doc(db, "guides", currentUser.uid), {
                name: name.value,
                phone: phone.value,
                nationality: nationality.value,
                gender: gender.value,
                languages: languagesArr,
                experience: experience.value,
                specialties: specialtiesArr,
                regions: regionsArr,
                price_hour: price_hour.value,
                price_day: price_day.value,
                bio: bio.value
            });

            navigate("dashboard"); // SPA 방식으로 이동
        } catch (err) {
            msg.innerText = err.message;
        }
    }
</script>

</body>
</html>
