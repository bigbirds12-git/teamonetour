<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
}

/* Centered Box */
.reg-box {
    width: 480px;
    background: white;
    padding: 30px;
    margin: 40px auto;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.reg-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

textarea {
    height: 100px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #005fcc;
}

#msg {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="reg-box">
    <h2>Guide Registration</h2>

    <input id="name" placeholder="이름 또는 닉네임">
    <input id="phone" placeholder="전화번호">

    <label style="margin-top:15px;">국적</label>
    <select id="nationality">
        <option value="South Korea">South Korea</option>
        <option value="UAE">UAE</option>
        <option value="Japan">Japan</option>
        <option value="China">China</option>
        <option value="India">India</option>
        <option value="Philippines">Philippines</option>
        <option value="Russia">Russia</option>
        <option value="UK">UK</option>
        <option value="USA">USA</option>
        <option value="France">France</option>
        <option value="Germany">Germany</option>
        <option value="Other">Other</option>
    </select>

    <label style="margin-top:15px;">성별</label>
    <select id="gender">
        <option value="남성">남성</option>
        <option value="여성">여성</option>
        <option value="기타">기타</option>
    </select>

    <label style="margin-top:15px;">가능 언어</label>
    <select id="languages" multiple>
        <option value="Korean">Korean</option>
        <option value="English">English</option>
        <option value="Arabic">Arabic</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
        <option value="Hindi">Hindi</option>
        <option value="Russian">Russian</option>
        <option value="Filipino">Filipino</option>
        <option value="French">French</option>
        <option value="German">German</option>
    </select>

    <input id="experience" placeholder="경력 (예: 5년)">

    <label style="margin-top:15px;">전문 분야</label>
    <select id="specialties" multiple>
        <option value="문화/예술">문화/예술</option>
        <option value="역사">역사</option>
        <option value="사막 사파리">사막 사파리</option>
        <option value="사진 촬영">사진 촬영</option>
        <option value="쇼핑">쇼핑</option>
        <option value="미식">미식</option>
        <option value="VIP 의전">VIP 의전</option>
        <option value="가족 여행">가족 여행</option>
        <option value="비즈니스 출장">비즈니스 출장</option>
    </select>

    <label style="margin-top:15px;">활동 지역</label>
    <select id="regions" multiple>
        <option value="Dubai Marina">Dubai Marina</option>
        <option value="Downtown Dubai">Downtown Dubai</option>
        <option value="Deira">Deira</option>
        <option value="Jumeirah">Jumeirah</option>
        <option value="Abu Dhabi">Abu Dhabi</option>
        <option value="Sharjah">Sharjah</option>
    </select>

    <input id="price_hour" placeholder="시간당 요금 (AED)">
    <input id="price_day" placeholder="하루 요금 (AED)">

    <textarea id="bio" placeholder="가이드 소개"></textarea>

    <button onclick="saveGuide()">정보 저장</button>
    <p id="msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, user => {
        if (!user) window.location.href = "guidelogin.html";
    });

    window.saveGuide = async function() {
        const user = auth.currentUser;
        if (!user) return;

        const specialties = Array.from(document.getElementById("specialties").selectedOptions).map(opt => opt.value);
        const regions = Array.from(document.getElementById("regions").selectedOptions).map(opt => opt.value);
        const languages = Array.from(document.getElementById("languages").selectedOptions).map(opt => opt.value);

        const guideData = {
            uid: user.uid,
            email: user.email,
            name: name.value,
            phone: phone.value,
            nationality: nationality.value,
            gender: gender.value,
            languages: languages,
            experience: experience.value,
            specialties: specialties,
            regions: regions,
            price_hour: price_hour.value,
            price_day: price_day.value,
            bio: bio.value,
            createdAt: new Date()
        };

        try {
            await setDoc(doc(db, "guides", user.uid), guideData);
            window.location.href = "../guidedata/guide-dashboard.html";
        } catch (err) {
            msg.innerText = err.message;
        }
    }
</script>

</body>
</html>
