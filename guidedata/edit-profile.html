<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Edit Guide Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f2937;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 30px 20px;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 500;
}

.sidebar a:hover {
    color: #ffffff;
}

/* Main Content */
.main {
    margin-left: 260px;
    padding: 40px;
}

.reg-box {
    width: 480px;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.reg-box h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

textarea {
    height: 100px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #005fcc;
}

#msg {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a href="/guidedata/guide-dashboard.html">Home</a>
    <a href="/guidedata/my-schedule.html">My Schedule</a>
    <a href="/guidedata/bookings.html">Bookings</a>
    <a href="/guidedata/messages.html">Messages</a>
    <a href="/guidedata/revenue.html">Revenue</a>
    <a href="/guidedata/edit-profile.html">Edit Profile</a>
</div>

<!-- Main Content -->
<div class="main">
    <div class="reg-box">
        <h2>Edit Profile</h2>

        <input id="name" placeholder="이름 또는 닉네임">
        <input id="phone" placeholder="전화번호">
        <input id="nationality" placeholder="국적">

        <label style="margin-top:15px;">성별</label>
        <select id="gender">
            <option value="남성">남성</option>
            <option value="여성">여성</option>
            <option value="기타">기타</option>
        </select>

        <input id="languages" placeholder="가능 언어 (예: Korean, English)">
        <input id="experience" placeholder="경력 (예: 5년)">

        <label style="margin-top:15px;">전문 분야</label>
        <select id="specialties" multiple>
            <option value="문화/예술">문화/예술</option>
            <option value="역사">역사</option>
            <option value="사막 사파리">사막 사파리</option>
            <option value="사진 촬영">사진 촬영</option>
            <option value="쇼핑">쇼핑</option>
            <option value="미식">미식</option>
            <option value="VIP 의전">VIP 의전</option>
            <option value="가족 여행">가족 여행</option>
            <option value="비즈니스 출장">비즈니스 출장</option>
        </select>

        <label style="margin-top:15px;">활동 지역</label>
        <select id="regions" multiple>
            <option value="Dubai Marina">Dubai Marina</option>
            <option value="Downtown Dubai">Downtown Dubai</option>
            <option value="Deira">Deira</option>
            <option value="Jumeirah">Jumeirah</option>
            <option value="Abu Dhabi">Abu Dhabi</option>
            <option value="Sharjah">Sharjah</option>
        </select>

        <input id="price_hour" placeholder="시간당 요금 (AED)">
        <input id="price_day" placeholder="하루 요금 (AED)">

        <textarea id="bio" placeholder="가이드 소개"></textarea>

        <button onclick="updateGuide()">정보 수정</button>
        <p id="msg"></p>
    </div>
</div>

<!-- Firebase v10 SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let uid = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "guidelogin.html";
            return;
        }
        uid = user.uid;
        loadProfile();
    });

    async function loadProfile() {
        const docRef = doc(db, "guides", uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            document.getElementById("msg").innerText = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();

        document.getElementById("name").value = g.name || "";
        document.getElementById("phone").value = g.phone || "";
        document.getElementById("nationality").value = g.nationality || "";
        document.getElementById("gender").value = g.gender || "남성";
        document.getElementById("languages").value = g.languages || "";
        document.getElementById("experience").value = g.experience || "";
        document.getElementById("price_hour").value = g.price_hour || "";
        document.getElementById("price_day").value = g.price_day || "";
        document.getElementById("bio").value = g.bio || "";

        // specialties multi-select
        const specialtiesSelect = document.getElementById("specialties");
        Array.from(specialtiesSelect.options).forEach(opt => {
            if (g.specialties?.includes(opt.value)) opt.selected = true;
        });

        // regions multi-select
        const regionsSelect = document.getElementById("regions");
        Array.from(regionsSelect.options).forEach(opt => {
            if (g.regions?.includes(opt.value)) opt.selected = true;
        });
    }

    window.updateGuide = async function() {
        const specialties = Array.from(document.getElementById("specialties").selectedOptions).map(opt => opt.value);
        const regions = Array.from(document.getElementById("regions").selectedOptions).map(opt => opt.value);

        try {
            await updateDoc(doc(db, "guides", uid), {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                nationality: document.getElementById("nationality").value,
                gender: document.getElementById("gender").value,
                languages: document.getElementById("languages").value,
                experience: document.getElementById("experience").value,
                specialties: specialties,
                regions: regions,
                price_hour: document.getElementById("price_hour").value,
                price_day: document.getElementById("price_day").value,
                bio: document.getElementById("bio").value
            });

            window.location.href = "../guidedata/guide-dashboard.html";
        } catch (err) {
            document.getElementById("msg").innerText = err.message;
        }
    }
</script>

</body>
</html>
