<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
}
.dashboard {
    display: flex;
    height: 100vh;
}
.sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #ddd;
    padding: 20px;
}
.sidebar h2 {
    font-size: 20px;
    margin-bottom: 20px;
}
.sidebar a {
    display: block;
    padding: 12px;
    margin-bottom: 10px;
    background: #f0f0f0;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
}
.sidebar a:hover {
    background: #e0e0e0;
}
.main {
    flex: 1;
    padding: 30px;
}
.main h1 {
    font-size: 28px;
    margin-bottom: 10px;
}
.logout-btn {
    padding: 10px 16px;
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 20px;
}
.logout-btn:hover {
    background: #d93636;
}
</style>
</head>

<body>

<div class="dashboard">

    <div class="sidebar">
        <h2>Guide Menu</h2>
        <a href="#">Home</a>
        <a href="#">My Schedule</a>
        <a href="#">Bookings</a>
        <a href="#">Messages</a>
        <a href="#">Revenue</a>
    </div>

    <div class="main">
        <h1>Guide Dashboard</h1>
        <p id="guideEmail">로그인 정보 확인 중...</p>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAqsQSy_MRdq3HhdJw08o2q6yWkz-aQPs",
  authDomain: "guidelogin-b0683.firebaseapp.com",
  projectId: "guidelogin-b0683",
  storageBucket: "guidelogin-b0683.appspot.com",
  messagingSenderId: "981519850247",
  appId: "1:981519850247:web:cc23628b17704957cc8618a",
  measurementId: "G-2V4745CJNQ"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* 로그인 여부 체크 */
auth.onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "../login/guidelogin.html";
    } else {
        document.getElementById("guideEmail").innerText =
            "로그인한 가이드: " + user.email;
    }
});

/* 로그아웃 */
function logout() {
    auth.signOut().then(() => {
        window.location.href = "../login/guidelogin.html";
    });
}
</script>

</body>
</html>
