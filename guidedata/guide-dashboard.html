<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f2937;
    color: white;
    position: fixed;
    left: 0;
    top: 0;
    padding: 30px 20px;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 500;
}

.sidebar a:hover {
    color: #ffffff;
}

/* Main */
.main {
    margin-left: 260px;
    padding: 40px;
}

/* Cards */
.card {
    background: white;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.card h2 {
    margin-bottom: 20px;
}

.info-row {
    margin-bottom: 10px;
    font-size: 16px;
}

.quick-links a {
    display: inline-block;
    margin-right: 12px;
    padding: 10px 16px;
    background: #0078ff;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

.quick-links a:hover {
    background: #005fcc;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a href="/guidedata/guide-dashboard.html">Home</a>
    <a href="/guidedata/my-schedule.html">My Schedule</a>
    <a href="/guidedata/bookings.html">Bookings</a>
    <a href="/guidedata/messages.html">Messages</a>
    <a href="/guidedata/revenue.html">Revenue</a>
    <a href="/guidedata/edit-profile.html">Edit Profile</a>
</div>

<!-- Main -->
<div class="main">

    <!-- Guide Info -->
    <div class="card">
        <h2>가이드 정보</h2>
        <div id="guideInfo">불러오는 중...</div>
    </div>

    <!-- Today Schedule -->
    <div class="card">
        <h2>오늘 일정</h2>
        <div id="todaySchedule">불러오는 중...</div>
    </div>

    <!-- Revenue Summary -->
    <div class="card">
        <h2>수익 요약</h2>
        <div id="revenueSummary">불러오는 중...</div>
    </div>

    <!-- Quick Links -->
    <div class="card">
        <h2>빠른 이동</h2>
        <div class="quick-links">
            <a href="/guidedata/my-schedule.html">일정 관리</a>
            <a href="/guidedata/bookings.html">예약 관리</a>
            <a href="/guidedata/messages.html">메시지</a>
            <a href="/guidedata/revenue.html">수익</a>
            <a href="/guidedata/edit-profile.html">프로필 수정</a>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let uid = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "guidelogin.html";
            return;
        }
        uid = user.uid;
        loadGuideInfo();
        loadTodaySchedule();
        loadRevenueSummary();
    });

    async function loadGuideInfo() {
        const docRef = doc(db, "guides", uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            guideInfo.innerHTML = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();

        guideInfo.innerHTML = `
            <div class="info-row"><strong>이름:</strong> ${g.name}</div>
            <div class="info-row"><strong>이메일:</strong> ${g.email}</div>
            <div class="info-row"><strong>전화번호:</strong> ${g.phone}</div>
            <div class="info-row"><strong>국적:</strong> ${g.nationality}</div>
            <div class="info-row"><strong>성별:</strong> ${g.gender}</div>
            <div class="info-row"><strong>언어:</strong> ${g.languages.join(", ")}</div>
            <div class="info-row"><strong>경력:</strong> ${g.experience}년</div>
            <div class="info-row"><strong>전문 분야:</strong> ${g.specialties.join(", ")}</div>
            <div class="info-row"><strong>활동 지역:</strong> ${g.regions.join(", ")}</div>
            <div class="info-row"><strong>시간당 요금:</strong> AED ${g.price_hour}</div>
            <div class="info-row"><strong>하루 요금:</strong> AED ${g.price_day}</div>
            <div class="info-row"><strong>소개:</strong> ${g.bio}</div>
        `;
    }

    function loadTodaySchedule() {
        todaySchedule.innerHTML = "오늘 일정이 없습니다.";
    }

    function loadRevenueSummary() {
        revenueSummary.innerHTML = "이번 주 수익 데이터가 없습니다.";
    }
</script>

</body>
</html>
