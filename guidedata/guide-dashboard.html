<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Dashboard (SPA)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f2937;
    color: white;
    padding: 30px 20px;
    position: fixed;
    left: 0;
    top: 0;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}

.sidebar a:hover {
    color: #ffffff;
}

/* Main */
.main {
    margin-left: 260px;
    padding: 40px;
    width: 100%;
}

/* Cards */
.card {
    background: white;
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.card h2 {
    margin-bottom: 20px;
}

.info-row {
    margin-bottom: 10px;
    font-size: 16px;
}

.quick-links a {
    display: inline-block;
    margin-right: 12px;
    padding: 10px 16px;
    background: #0078ff;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

.quick-links a:hover {
    background: #005fcc;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a onclick="navigate('dashboard')">Home</a>
    <a onclick="navigate('schedule')">My Schedule</a>
    <a onclick="navigate('bookings')">Bookings</a>
    <a onclick="navigate('messages')">Messages</a>
    <a onclick="navigate('revenue')">Revenue</a>
    <a onclick="navigate('profile')">Edit Profile</a>
</div>

<!-- Main SPA Container -->
<div class="main" id="app">
    <!-- SPA 화면이 여기에 로드됨 -->
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    let currentUser = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "guidelogin.html";
            return;
        }
        currentUser = user;
        navigate("dashboard"); // 기본 화면
    });

    /* ---------------- SPA ROUTER ---------------- */
    function navigate(page) {
        if (page === "dashboard") loadDashboard();
        else document.getElementById("app").innerHTML = `<h2>${page} 화면 준비 중</h2>`;
    }

    /* ---------------- DASHBOARD 화면 ---------------- */
    async function loadDashboard() {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>가이드 정보</h2>
                <div id="guideInfo">불러오는 중...</div>
            </div>

            <div class="card">
                <h2>오늘 일정</h2>
                <div id="todaySchedule">불러오는 중...</div>
            </div>

            <div class="card">
                <h2>수익 요약</h2>
                <div id="revenueSummary">불러오는 중...</div>
            </div>

            <div class="card">
                <h2>빠른 이동</h2>
                <div class="quick-links">
                    <a onclick="navigate('schedule')">일정 관리</a>
                    <a onclick="navigate('bookings')">예약 관리</a>
                    <a onclick="navigate('messages')">메시지</a>
                    <a onclick="navigate('revenue')">수익</a>
                    <a onclick="navigate('profile')">프로필 수정</a>
                </div>
            </div>
        `;

        loadGuideInfo();
        loadTodaySchedule();
        loadRevenueSummary();
    }

    /* ---------------- 데이터 로딩 ---------------- */
    async function loadGuideInfo() {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            guideInfo.innerHTML = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();

        guideInfo.innerHTML = `
            <div class="info-row"><strong>이름:</strong> ${g.name}</div>
            <div class="info-row"><strong>이메일:</strong> ${g.email}</div>
            <div class="info-row"><strong>전화번호:</strong> ${g.phone}</div>
            <div class="info-row"><strong>국적:</strong> ${g.nationality}</div>
            <div class="info-row"><strong>성별:</strong> ${g.gender}</div>
            <div class="info-row"><strong>언어:</strong> ${g.languages.join(", ")}</div>
            <div class="info-row"><strong>경력:</strong> ${g.experience}년</div>
            <div class="info-row"><strong>전문 분야:</strong> ${g.specialties.join(", ")}</div>
            <div class="info-row"><strong>활동 지역:</strong> ${g.regions.join(", ")}</div>
            <div class="info-row"><strong>시간당 요금:</strong> AED ${g.price_hour}</div>
            <div class="info-row"><strong>하루 요금:</strong> AED ${g.price_day}</div>
            <div class="info-row"><strong>소개:</strong> ${g.bio}</div>
        `;
    }

    function loadTodaySchedule() {
        todaySchedule.innerHTML = "오늘 일정이 없습니다.";
    }

    function loadRevenueSummary() {
        revenueSummary.innerHTML = "이번 주 수익 데이터가 없습니다.";
    }
</script>
<!-- ⭐ AI Assistant Script는 여기! -->
<script src="js/ai-assistant.js"></script>
    
</body>
</html>
