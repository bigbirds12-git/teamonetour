<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team One Tour – 일정 관리</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        /* ===== 상태 표시줄 (로그인 정보 표시) ===== */
        .status-bar {
            background: #f8fafc;
            padding: 10px 32px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            font-size: 13px;
            color: #475569;
        }
        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-bar .status-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-bar .status-item .dot.online { background: #22c55e; }
        .status-bar .status-item .dot.offline { background: #ef4444; }
        .status-bar .status-item .dot.warning { background: #f59e0b; }
        .status-bar .status-item .label { color: #94a3b8; font-weight: 500; }
        .status-bar .status-item .value { font-weight: 600; color: #1e293b; }
        .status-bar .status-item .value.error { color: #ef4444; }
        .status-bar .status-item .value.success { color: #22c55e; }
        .status-bar .status-item .value.warning { color: #f59e0b; }
        .status-bar .collection-badge {
            background: #e2e8f0;
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            font-family: 'Courier New', monospace;
        }

        /* ===== 로그인/로그아웃 버튼 ===== */
        .btn-logout {
            background: #ef4444;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background: #dc2626;
        }

        /* ===== 나머지 스타일 (이전과 동일) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 20px; }
        .app-container { max-width: 1280px; margin: 0 auto; background: #ffffff; border-radius: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.06); overflow: hidden; min-height: 90vh; display: flex; flex-direction: column; }
        .app-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid #edf2f7; flex-wrap: wrap; gap: 12px; background: #ffffff; }
        .app-header .logo-area { display: flex; align-items: center; gap: 12px; }
        .app-header .logo-area .logo-icon { font-size: 24px; color: #2563eb; }
        .app-header .logo-area h1 { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .app-header .logo-area h1 span { color: #2563eb; }
        .app-header .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .btn-primary { background: #2563eb; color: #ffffff; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,0.3); }
        .btn-outline { background: transparent; color: #4b5563; border: 1px solid #d1d5db; }
        .btn-outline:hover { background: #f9fafb; }
        .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
        .btn-icon { width: 36px; height: 36px; border-radius: 10px; background: transparent; border: 1px solid #e5e7eb; color: #6b7280; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: #f3f4f6; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1; min-height: 600px; }
        .left-panel { padding: 28px 32px; border-right: 1px solid #edf2f7; background: #fafbfc; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .calendar-header .month-year { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .calendar-header .nav-buttons { display: flex; gap: 6px; }
        .calendar-header .nav-buttons button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e5e7eb; background: #ffffff; color: #4b5563; cursor: pointer; transition: all 0.2s ease; }
        .calendar-header .nav-buttons button:hover { background: #f3f4f6; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 24px; }
        .calendar-grid .weekday { text-align: center; font-size: 12px; font-weight: 600; color: #9ca3af; padding: 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .calendar-grid .day { text-align: center; padding: 10px 0; border-radius: 8px; font-size: 14px; font-weight: 500; color: #4b5563; cursor: pointer; transition: all 0.15s ease; position: relative; }
        .calendar-grid .day:hover { background: #e5e7eb; }
        .calendar-grid .day.today { background: #2563eb; color: #ffffff; font-weight: 700; }
        .calendar-grid .day.other-month { color: #d1d5db; }
        .calendar-grid .day.has-event::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #2563eb; }
        .calendar-grid .day.today.has-event::after { background: #ffffff; }
        .schedule-list { margin-top: 8px; }
        .schedule-list .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .schedule-list .list-header h3 { font-size: 15px; font-weight: 600; color: #1a1a2e; }
        .schedule-list .list-header .count { font-size: 13px; color: #9ca3af; font-weight: 500; }
        .schedule-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #ffffff; border-radius: 10px; margin-bottom: 8px; border: 1px solid #edf2f7; transition: all 0.2s ease; cursor: pointer; }
        .schedule-item:hover { border-color: #2563eb; box-shadow: 0 2px 12px rgba(37,99,235,0.06); }
        .schedule-item .time { font-size: 13px; font-weight: 600; color: #2563eb; min-width: 52px; }
        .schedule-item .info { flex: 1; }
        .schedule-item .info .title { font-size: 14px; font-weight: 600; color: #1a1a2e; }
        .schedule-item .info .desc { font-size: 12px; color: #9ca3af; }
        .schedule-item .status { font-size: 11px; font-weight: 600; padding: 2px 12px; border-radius: 100px; }
        .schedule-item .status.confirmed { background: #d1fae5; color: #065f46; }
        .schedule-item .status.pending { background: #fef3c7; color: #92400e; }
        .schedule-item .status.cancelled { background: #fee2e2; color: #991b1b; }
        .right-panel { padding: 28px 32px; background: #ffffff; display: flex; flex-direction: column; }
        .right-panel .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .right-panel .panel-header h2 { font-size: 18px; font-weight: 700; color: #1a1a2e; }
        .right-panel .panel-header .sub { font-size: 13px; color: #9ca3af; }
        .filter-section { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-row .filter-group { flex: 1; min-width: 120px; }
        .filter-row .filter-group label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 4px; }
        .filter-row .filter-group select, .filter-row .filter-group input { width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fafbfc; transition: border-color 0.2s ease; color: #1a1a2e; }
        .filter-row .filter-group select:focus, .filter-row .filter-group input:focus { outline: none; border-color: #2563eb; }
        .filter-actions { display: flex; gap: 10px; margin-top: 4px; }
        .result-area { flex: 1; min-height: 200px; }
        .result-area .result-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #edf2f7; margin-bottom: 16px; }
        .result-area .result-header .result-count { font-size: 14px; color: #6b7280; }
        .result-area .result-header .result-count strong { color: #1a1a2e; }
        .result-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid #edf2f7; margin-bottom: 10px; transition: all 0.2s ease; cursor: pointer; }
        .result-item:hover { border-color: #2563eb; background: #f8faff; }
        .result-item .result-date { font-size: 13px; font-weight: 600; color: #2563eb; min-width: 60px; }
        .result-item .result-info { flex: 1; }
        .result-item .result-info .result-title { font-size: 14px; font-weight: 600; color: #1a1a2e; }
        .result-item .result-info .result-meta { font-size: 12px; color: #9ca3af; }
        .result-item .result-status { font-size: 11px; font-weight: 600; padding: 2px 12px; border-radius: 100px; }
        .result-item .result-status.confirmed { background: #d1fae5; color: #065f46; }
        .result-item .result-status.pending { background: #fef3c7; color: #92400e; }
        .result-item .result-status.cancelled { background: #fee2e2; color: #991b1b; }
        .schedule-empty, .result-empty { text-align: center; padding: 32px 0; color: #9ca3af; }
        .schedule-empty i, .result-empty i { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.5; }
        .result-empty i { font-size: 40px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #ffffff; border-radius: 20px; padding: 32px; max-width: 520px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal .modal-header h2 { font-size: 20px; font-weight: 700; }
        .modal .modal-close { background: none; border: none; font-size: 24px; color: #9ca3af; cursor: pointer; padding: 4px; }
        .modal .modal-close:hover { color: #1a1a2e; }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fafbfc; transition: border-color 0.2s ease; }
        .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { outline: none; border-color: #2563eb; background: #ffffff; }
        .modal .form-group textarea { resize: vertical; min-height: 60px; }
        .modal .form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

        .toast { position: fixed; bottom: 30px; right: 30px; background: #1a1a2e; color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,0.2); z-index: 10000; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #2563eb; }

        @media (max-width: 992px) { .main-content { grid-template-columns: 1fr; } .left-panel { border-right: none; border-bottom: 1px solid #edf2f7; } .app-header { padding: 14px 20px; } .left-panel, .right-panel { padding: 20px; } .status-bar { padding: 8px 20px; font-size: 12px; gap: 10px; } }
        @media (max-width: 640px) { body { padding: 10px; } .app-container { border-radius: 16px; } .app-header .logo-area h1 { font-size: 16px; } .app-header .header-actions .btn span { display: none; } .filter-row { flex-direction: column; } .filter-row .filter-group { min-width: 100%; } .calendar-grid .day { padding: 8px 0; font-size: 12px; } .schedule-item, .result-item { flex-wrap: wrap; gap: 8px; } .status-bar { flex-direction: column; align-items: flex-start; gap: 6px; } }
        @media (max-width: 480px) { .app-header { padding: 12px 16px; } .app-header .logo-area .logo-icon { font-size: 18px; } .app-header .logo-area h1 { font-size: 14px; } .btn { padding: 6px 12px; font-size: 12px; } .left-panel, .right-panel { padding: 16px; } .calendar-header .month-year { font-size: 15px; } }
    </style>
</head>

<body>

    <div class="toast" id="toast"></div>

    <!-- ===== 모달 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>✏️ 새 일정 입력</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="scheduleForm" onsubmit="saveSchedule(event)">
                <div class="form-group">
                    <label>📅 날짜</label>
                    <input type="date" id="inputDate" required />
                </div>
                <div class="form-group">
                    <label>⏰ 시간</label>
                    <input type="time" id="inputTime" required />
                </div>
                <div class="form-group">
                    <label>📌 제목</label>
                    <input type="text" id="inputTitle" placeholder="예: 두바이 시티 투어" required />
                </div>
                <div class="form-group">
                    <label>📍 지역</label>
                    <select id="inputRegion">
                        <option value="두바이">두바이</option>
                        <option value="아부다비">아부다비</option>
                        <option value="샤르자">샤르자</option>
                        <option value="라스알카이마">라스알카이마</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>👥 인원</label>
                    <input type="number" id="inputPeople" value="2" min="1" required />
                </div>
                <div class="form-group">
                    <label>📝 메모</label>
                    <textarea id="inputMemo" placeholder="추가 정보를 입력하세요"></textarea>
                </div>
                <div class="form-group" style="background:#f8fafc; padding:12px 16px; border-radius:10px; border:1px solid #e5e7eb;">
                    <div style="font-size:12px; color:#6b7280; margin-bottom:4px;">👤 연결된 가이드</div>
                    <div id="guideDisplay" style="font-size:14px; font-weight:500; color:#1a1a2e;">
                        <span id="guideNameDisplay">로그인 필요</span>
                        <span id="guideEmailDisplay" style="font-size:12px; color:#9ca3af; font-weight:400; margin-left:8px;"></span>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== 메인 ===== -->
    <div class="app-container">

        <!-- ===== 상단 상태 표시줄 (로그인 정보 표시) ===== -->
        <div class="status-bar" id="statusBar">
            <div class="status-item">
                <span class="dot" id="statusDot"></span>
                <span class="label">Firebase:</span>
                <span class="value" id="statusText">연결 중...</span>
            </div>
            <div class="status-item">
                <span class="label">UID:</span>
                <span class="value" id="statusUid">-</span>
            </div>
            <div class="status-item">
                <span class="label">가이드:</span>
                <span class="value" id="statusGuide">-</span>
            </div>
            <div class="status-item">
                <span class="label">컬렉션:</span>
                <span class="collection-badge">schedules</span>
                <span style="color:#94a3b8;">/</span>
                <span class="collection-badge" style="background:#dbeafe; color:#2563eb;">guides</span>
            </div>
            <div class="status-item" style="margin-left:auto;">
                <button class="btn-logout" onclick="logout()" id="logoutBtn" style="display:none;">
                    <i class="fas fa-sign-out-alt"></i> 로그아웃
                </button>
            </div>
        </div>

        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon"><i class="fas fa-compass"></i></span>
                <h1>Team One <span>Tour</span></h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> <span>새로 입력하기</span>
                </button>
                <button class="btn-icon"><i class="fas fa-bell"></i></button>
                <button class="btn-icon"><i class="fas fa-user-circle"></i></button>
            </div>
        </header>

        <div class="main-content">
            <!-- 왼쪽 -->
            <div class="left-panel">
                <div class="calendar-header">
                    <span class="month-year" id="monthYear">2026년 8월</span>
                    <div class="nav-buttons">
                        <button onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>

                <div class="schedule-list">
                    <div class="list-header">
                        <h3>📋 오늘의 일정</h3>
                        <span class="count" id="todayCount">0개</span>
                    </div>
                    <div id="todayScheduleList">
                        <div class="schedule-empty"><i class="fas fa-calendar-day"></i>오늘 일정이 없습니다</div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 -->
            <div class="right-panel">
                <div class="panel-header">
                    <div>
                        <h2>🔍 일정 조회</h2>
                        <span class="sub">날짜와 조건으로 일정을 검색하세요</span>
                    </div>
                    <button class="btn btn-outline btn-sm" onclick="exportData()">
                        <i class="fas fa-download"></i> 내보내기
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>시작일</label>
                            <input type="date" id="filterStartDate" />
                        </div>
                        <div class="filter-group">
                            <label>종료일</label>
                            <input type="date" id="filterEndDate" />
                        </div>
                        <div class="filter-group">
                            <label>상태</label>
                            <select id="filterStatus">
                                <option value="">전체</option>
                                <option value="confirmed">확정</option>
                                <option value="pending">대기</option>
                                <option value="cancelled">취소</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>지역</label>
                            <select id="filterRegion">
                                <option value="">전체</option>
                                <option value="두바이">두바이</option>
                                <option value="아부다비">아부다비</option>
                                <option value="샤르자">샤르자</option>
                            </select>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-primary" onclick="searchSchedules()">
                                <i class="fas fa-search"></i> 조회
                            </button>
                            <button class="btn btn-outline" onclick="resetFilter()">
                                <i class="fas fa-redo"></i> 초기화
                            </button>
                        </div>
                    </div>
                </div>

                <div class="result-area">
                    <div class="result-header">
                        <span class="result-count" id="resultCount">총 <strong>0</strong>건</span>
                        <span style="font-size:13px; color:#9ca3af;">최신순</span>
                    </div>
                    <div id="searchResultList">
                        <div class="result-empty"><i class="fas fa-search"></i>조회 조건을 입력하고 검색하세요</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔥 Firebase 설정 (여러분의 실제 값으로 바꾸세요!)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXX",  // ← 실제 API 키
            authDomain: "team-one-tour.firebaseapp.com",
            projectId: "team-one-tour",
            storageBucket: "team-one-tour.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // ============================================================
        // 🔥 Firebase 초기화
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // 🔥 컬렉션 이름
        // ============================================================
        const SCHEDULES_COLLECTION = 'schedules';
        const GUIDES_COLLECTION = 'guides';  // ⚠️ 소문자 g

        // ============================================================
        // 🔥 전역 변수 (UID는 로그인 후 할당)
        // ============================================================
        let CURRENT_UID = null;          // ← 하드코딩 제거! 로그인 후 할당됨
        let currentGuideInfo = null;
        let currentYear = 2026;
        let currentMonth = 8;
        let allSchedules = [];

        // ============================================================
        // 🔥 상태 표시줄 업데이트 함수
        // ============================================================
        function updateStatus(dotState, text, className = '') {
            const dot = document.getElementById('statusDot');
            const textEl = document.getElementById('statusText');
            dot.className = 'dot ' + dotState;
            textEl.textContent = text;
            textEl.className = 'value' + (className ? ' ' + className : '');
        }

        function updateGuideStatus(name, className = '') {
            const el = document.getElementById('statusGuide');
            el.textContent = name || '-';
            el.className = 'value' + (className ? ' ' + className : '');
        }

        function updateUid(uid) {
            document.getElementById('statusUid').textContent = uid || '-';
        }

        // ============================================================
        // 🔥 토스트 메시지
        // ============================================================
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ============================================================
        // 🔥 현재 가이드 정보 불러오기 (UID 기반)
        // ============================================================
        async function loadCurrentGuide() {
            if (!CURRENT_UID) {
                updateGuideStatus('로그인 필요', 'warning');
                document.getElementById('guideNameDisplay').textContent = '로그인 필요';
                document.getElementById('guideEmailDisplay').textContent = '';
                return;
            }

            try {
                const doc = await db.collection(GUIDES_COLLECTION).doc(CURRENT_UID).get();
                if (doc.exists) {
                    currentGuideInfo = { uid: CURRENT_UID, ...doc.data() };
                    console.log('✅ 가이드 정보 로드 성공:', currentGuideInfo);

                    updateGuideStatus(currentGuideInfo.name || '이름 없음', 'success');
                    document.getElementById('guideNameDisplay').textContent = currentGuideInfo.name || '이름 없음';
                    document.getElementById('guideEmailDisplay').textContent = currentGuideInfo.email || '';
                    showToast('✅ 가이드 정보를 불러왔습니다!', 'success');
                } else {
                    console.warn('⚠️ guides 컬렉션에 문서 없음. UID:', CURRENT_UID);
                    updateGuideStatus('❌ guides 컬렉션에 문서 없음', 'error');
                    document.getElementById('guideNameDisplay').textContent = '❌ 가이드 정보 없음';
                    document.getElementById('guideEmailDisplay').textContent = '(guides 컬렉션에 추가 필요)';
                    showToast('⚠️ guides 컬렉션에 가이드 문서를 추가해주세요!', 'error');
                }
            } catch (error) {
                console.error('❌ 가이드 정보 로드 오류:', error);
                updateGuideStatus('❌ 로드 실패', 'error');
                document.getElementById('guideNameDisplay').textContent = '❌ 로드 실패';
                document.getElementById('guideEmailDisplay').textContent = '';
                showToast('❌ 가이드 정보를 불러오지 못했습니다', 'error');
            }
        }

        // ============================================================
        // 🔥 모달
        // ============================================================
        function openModal() {
            if (!CURRENT_UID) {
                showToast('⚠️ 로그인이 필요합니다!', 'error');
                return;
            }
            if (!currentGuideInfo) {
                showToast('⚠️ 가이드 정보가 없습니다. guides 컬렉션에 문서를 추가해주세요.', 'error');
                return;
            }
            document.getElementById('modalOverlay').classList.add('active');
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
            document.getElementById('inputTime').value = '10:00';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('scheduleForm').reset();
        }

        // ============================================================
        // 🔥 저장 (UID 기반)
        // ============================================================
        async function saveSchedule(event) {
            event.preventDefault();

            if (!CURRENT_UID) {
                showToast('⚠️ 로그인이 필요합니다!', 'error');
                return;
            }
            if (!currentGuideInfo) {
                showToast('⚠️ 가이드 정보가 없습니다.', 'error');
                return;
            }

            const data = {
                date: document.getElementById('inputDate').value,
                time: document.getElementById('inputTime').value,
                title: document.getElementById('inputTitle').value,
                guideUid: CURRENT_UID,
                guideName: currentGuideInfo.name || '',
                guideEmail: currentGuideInfo.email || '',
                region: document.getElementById('inputRegion').value,
                people: parseInt(document.getElementById('inputPeople').value),
                memo: document.getElementById('inputMemo').value || '',
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection(SCHEDULES_COLLECTION).add(data);
                showToast('✅ 일정이 저장되었습니다!', 'success');
                closeModal();
                await refreshAll();
            } catch (error) {
                console.error('저장 오류:', error);
                showToast('❌ 저장 실패: ' + error.message, 'error');
            }
        }

        // ============================================================
        // 🔥 데이터 새로고침
        // ============================================================
        async function refreshAll() {
            try {
                const snapshot = await db.collection(SCHEDULES_COLLECTION).get();
                allSchedules = [];
                snapshot.forEach(doc => {
                    allSchedules.push({ id: doc.id, ...doc.data() });
                });
            } catch (e) {
                console.log('데이터 로드 오류:', e);
            }
            renderCalendar();
            await loadTodaySchedules();
            await searchSchedules();
        }

        // ============================================================
        // 🔥 오늘 일정
        // ============================================================
        async function loadTodaySchedules() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const snapshot = await db.collection(SCHEDULES_COLLECTION)
                    .where('date', '==', today)
                    .orderBy('time')
                    .get();

                const list = document.getElementById('todayScheduleList');
                const countEl = document.getElementById('todayCount');

                if (snapshot.empty) {
                    list.innerHTML =
                    `<div class="schedule-empty"><i class="fas fa-calendar-day"></i>오늘 일정이 없습니다</div>`;
                    countEl.textContent = '0개';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const statusClass = d.status || 'pending';
                    const statusLabel = { 'confirmed': '확정', 'pending': '대기', 'cancelled': '취소' } [statusClass] ||
                        '대기';
                    html += `
                        <div class="schedule-item" onclick="viewDetail('${doc.id}')">
                            <span class="time">${d.time}</span>
                            <div class="info">
                                <div class="title">${d.title}</div>
                                <div class="desc">가이드: ${d.guideName || d.guideEmail} · ${d.people}명</div>
                            </div>
                            <span class="status ${statusClass}">${statusLabel}</span>
                        </div>
                    `;
                });

                list.innerHTML = html;
                countEl.textContent = snapshot.size + '개';
            } catch (error) {
                console.error('조회 오류:', error);
            }
        }

        // ============================================================
        // 🔥 검색
        // ============================================================
        async function searchSchedules() {
            const startDate = document.getElementById('filterStartDate').value;
            const endDate = document.getElementById('filterEndDate').value;
            const status = document.getElementById('filterStatus').value;
            const region = document.getElementById('filterRegion').value;

            try {
                let query = db.collection(SCHEDULES_COLLECTION);

                if (startDate) query = query.where('date', '>=', startDate);
                if (endDate) query = query.where('date', '<=', endDate);
                if (region) query = query.where('region', '==', region);
                if (status) query = query.where('status', '==', status);

                const snapshot = await query.orderBy('date', 'desc').orderBy('time').get();

                const list = document.getElementById('searchResultList');
                const countEl = document.getElementById('resultCount');

                if (snapshot.empty) {
                    list.innerHTML = `<div class="result-empty"><i class="fas fa-search"></i>검색 결과가 없습니다</div>`;
                    countEl.innerHTML = '총 <strong>0</strong>건';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const statusClass = d.status || 'pending';
                    const statusLabel = { 'confirmed': '확정', 'pending': '대기', 'cancelled': '취소' } [statusClass] ||
                        '대기';
                    const displayDate = d.date.replace(/-/g, '/');

                    html += `
                        <div class="result-item" onclick="viewDetail('${doc.id}')">
                            <span class="result-date">${displayDate}</span>
                            <div class="result-info">
                                <div class="result-title">${d.title}</div>
                                <div class="result-meta">${d.guideName || d.guideEmail} · ${d.people}명 · ${d.time} · ${d.region}</div>
                            </div>
                            <span class="result-status ${statusClass}">${statusLabel}</span>
                        </div>
                    `;
                });

                list.innerHTML = html;
                countEl.innerHTML = `총 <strong>${snapshot.size}</strong>건`;
            } catch (error) {
                console.error('검색 오류:', error);
            }
        }

        // ============================================================
        // 기타 함수
        // ============================================================
        function viewDetail(id) {
            alert('📌 일정 상세 (ID: ' + id + ')');
        }

        function resetFilter() {
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterRegion').value = '';
            searchSchedules();
        }

        function exportData() {
            alert('📥 내보내기 (데모)');
        }

        // ============================================================
        // 달력
        // ============================================================
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYear = document.getElementById('monthYear');
            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            monthYear.textContent = `${currentYear}년 ${monthNames[currentMonth - 1]}`;

            const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth - 1, 0).getDate();

            const today = new Date().toISOString().split('T')[0];

            let html = '';
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            weekdays.forEach(d => {
                html += `<div class="weekday">${d}</div>`;
            });

            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="day other-month">${daysInPrevMonth - i}</div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const hasEvent = allSchedules.some(s => s.date === dateStr);

                let classes = 'day';
                if (isToday) classes += ' today';
                if (hasEvent) classes += ' has-event';

                html += `<div class="${classes}" onclick="selectDate('${dateStr}')">${d}</div>`;
            }

            const totalCells = firstDay + daysInMonth;
            const remaining = 7 - (totalCells % 7);
            if (remaining < 7) {
                for (let d = 1; d <= remaining; d++) {
                    html += `<div class="day other-month">${d}</div>`;
                }
            }

            grid.innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 12) { currentMonth = 1;
                currentYear++; } else if (currentMonth < 1) { currentMonth = 12;
                currentYear--; }
            renderCalendar();
        }

        function selectDate(dateStr) {
            document.getElementById('filterStartDate').value = dateStr;
            document.getElementById('filterEndDate').value = dateStr;
            searchSchedules();
            showToast(`📅 ${dateStr} 일정을 조회합니다`, 'info');
        }

        // ============================================================
        // 🔥 로그아웃 함수
        // ============================================================
        function logout() {
            auth.signOut().then(() => {
                showToast('👋 로그아웃 되었습니다.', 'info');
                // 상태 초기화
                CURRENT_UID = null;
                currentGuideInfo = null;
                updateUid('-');
                updateGuideStatus('로그아웃', 'warning');
                document.getElementById('guideNameDisplay').textContent = '로그아웃';
                document.getElementById('guideEmailDisplay').textContent = '';
                document.getElementById('logoutBtn').style.display = 'none';
                // 화면 초기화
                document.getElementById('todayScheduleList').innerHTML =
                    `<div class="schedule-empty"><i class="fas fa-calendar-day"></i>로그인이 필요합니다</div>`;
                document.getElementById('searchResultList').innerHTML =
                    `<div class="result-empty"><i class="fas fa-search"></i>로그인이 필요합니다</div>`;
                document.getElementById('todayCount').textContent = '0개';
                document.getElementById('resultCount').innerHTML = '총 <strong>0</strong>건';
                allSchedules = [];
                renderCalendar();
            }).catch((error) => {
                console.error('로그아웃 오류:', error);
                showToast('❌ 로그아웃 실패: ' + error.message, 'error');
            });
        }

        // ============================================================
        // 🔥 초기화 함수 (로그인 후 실행)
        // ============================================================
        async function init() {
            // UID 표시
            updateUid(CURRENT_UID);

            // 가이드 정보 로드
            await loadCurrentGuide();

            // 일정 데이터 로드
            try {
                const snapshot = await db.collection(SCHEDULES_COLLECTION).get();
                allSchedules = [];
                snapshot.forEach(doc => {
                    allSchedules.push({ id: doc.id, ...doc.data() });
                });
            } catch (error) {
                console.log('데이터 로드 오류:', error);
            }

            renderCalendar();
            await loadTodaySchedules();
            await searchSchedules();

            // 로그아웃 버튼 표시
            document.getElementById('logoutBtn').style.display = 'inline-block';

            updateStatus('online', '연결됨', 'success');
            showToast('✅ 로그인 성공!', 'success');
        }

        // ============================================================
        // 🔥🔥🔥 가장 중요! Firebase Auth 상태 감지 🔥🔥🔥
        // ============================================================
        // 페이지 로드 시 자동으로 실행되며, 로그인 상태 변화를 감지합니다.
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // ✅ 로그인 성공! 실제 사용자 UID 할당
                CURRENT_UID = user.uid;
                console.log('✅ 로그인 성공! UID:', CURRENT_UID);

                // Firebase 연결 상태 업데이트
                updateStatus('online', '연결됨 (로그인)', 'success');

                // 🔥 데이터 초기화 실행
                await init();

            } else {
                // ❌ 로그아웃 상태 또는 로그인 안됨
                console.log('⚠️ 로그인되지 않음. 로그인이 필요합니다.');

                CURRENT_UID = null;
                currentGuideInfo = null;
                updateStatus('warning', '로그인 필요', 'warning');
                updateUid('-');
                updateGuideStatus('로그인 필요', 'warning');

                document.getElementById('guideNameDisplay').textContent = '로그인 필요';
                document.getElementById('guideEmailDisplay').textContent = '';
                document.getElementById('logoutBtn').style.display = 'none';

                // 화면에 로그인 필요 메시지 표시
                document.getElementById('todayScheduleList').innerHTML =
                    `<div class="schedule-empty"><i class="fas fa-lock"></i>로그인이 필요합니다</div>`;
                document.getElementById('searchResultList').innerHTML =
                    `<div class="result-empty"><i class="fas fa-lock"></i>로그인이 필요합니다</div>`;
                document.getElementById('todayCount').textContent = '0개';
                document.getElementById('resultCount').innerHTML = '총 <strong>0</strong>건';

                // TODO: 여기에 로그인 화면으로 이동하는 코드 추가 가능
                // 예: window.location.href = '/login.html';
                // 또는 로그인 모달 표시
                showToast('🔑 로그인이 필요합니다. Firebase Authentication에 등록된 계정으로 로그인해주세요.', 'info');
            }
        });

        // ============================================================
        // 🔥 페이지 로드 시 초기 연결 상태 표시
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Firebase 연결 상태 확인
            if (firebase.apps.length > 0) {
                updateStatus('online', '연결됨 (인증 대기 중)', 'success');
            } else {
                updateStatus('offline', '연결 실패', 'error');
            }
        });
    </script>
