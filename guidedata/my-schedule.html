<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Platform – Schedule Management</title>

<!-- ... 모든 스타일은 동일 ... -->

</head>
<body>

<!-- ===== 로딩 오버레이 ===== -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="color: #4b5563; font-weight: 500;" id="loadingText">로딩 중...</p>
</div>

<!-- ===== 일정 컨테이너 ===== -->
<div class="schedule-container">
    
    <!-- ===== 캘린더 영역 ===== -->
    <div class="calendar-wrapper">
        <div class="calendar-header">
            <h2 id="calendarTitle">2026년 8월</h2>
            <div class="calendar-nav">
                <button id="prevMonthBtn">◀</button>
                <button id="todayBtn">오늘</button>
                <button id="nextMonthBtn">▶</button>
            </div>
        </div>
        
        <div class="calendar-grid" id="calendarGrid">
            <!-- JavaScript로 생성 -->
        </div>
    </div>

    <!-- ===== 일정 리스트 영역 ===== -->
    <div class="schedule-list-wrapper">
        <div class="schedule-list-header">
            <h3 id="listTitle">📋 일정</h3>
            <span class="date-badge" id="dateBadge">2026년 8월 15일</span>
        </div>
        <div id="scheduleList">
            <!-- JavaScript로 생성 -->
        </div>
        <button class="add-schedule-btn" id="addScheduleBtn">➕ 새 일정 추가</button>
    </div>

</div>

<!-- ===== 일정 추가/수정 모달 ===== -->
<div class="schedule-modal-overlay" id="scheduleModal">
    <div class="schedule-modal">
        <h2 id="modalTitle">✏️ 새 일정 추가</h2>
        <form id="scheduleForm" onsubmit="return false;">
            <input type="hidden" id="editScheduleId">
            
            <div class="form-group">
                <label>투어 제목 <span style="color:#dc2626;">*</span></label>
                <input id="schedTitle" placeholder="예: 두바이 시티 투어">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>날짜 <span style="color:#dc2626;">*</span></label>
                    <input id="schedDate" type="date">
                </div>
                <div class="form-group">
                    <label>시간</label>
                    <input id="schedTime" type="time">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>고객명</label>
                    <input id="schedCustomer" placeholder="고객 이름">
                </div>
                <div class="form-group">
                    <label>인원</label>
                    <input id="schedCount" type="number" placeholder="0" min="0">
                </div>
            </div>
            
            <div class="form-group">
                <label>장소</label>
                <input id="schedLocation" placeholder="예: Dubai Marina">
            </div>
            
            <div class="form-group">
                <label>상태</label>
                <select id="schedStatus">
                    <option value="confirmed">✅ 예약완료</option>
                    <option value="pending">⏳ 대기중</option>
                    <option value="completed">✔️ 완료</option>
                    <option value="cancelled">❌ 취소</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>메모</label>
                <textarea id="schedMemo" placeholder="추가 메모를 입력하세요"></textarea>
            </div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" id="cancelBtn">취소</button>
                <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">🗑️ 삭제</button>
                <button type="button" class="btn btn-primary" id="saveBtn">💾 저장</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    // ============================================
    //  Firebase Import
    // ============================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { 
        getFirestore, 
        collection, 
        doc, 
        getDocs, 
        addDoc, 
        updateDoc, 
        deleteDoc,
        query, 
        where,
        Timestamp 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
        apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
        authDomain: "guidelogin-b0053.firebaseapp.com",
        projectId: "guidelogin-b0053",
        storageBucket: "guidelogin-b0053.firebasestorage.app",
        messagingSenderId: "981519805247",
        appId: "1:981519805247:web:cc32682b177a4957c0818a",
        measurementId: "G-2VR4TS6JND"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ============================================
    //  전역 변수
    // ============================================
    let currentUser = null;
    let schedules = [];
    let currentViewDate = new Date();
    let selectedDate = new Date();
    let isLoading = false;

    // ============================================
    //  유틸리티 함수
    // ============================================
    function getDateString(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    
    function formatDateDisplay(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        return `${parts[0]}년 ${parseInt(parts[1])}월 ${parseInt(parts[2])}일`;
    }
    
    function getStatusText(status) {
        const map = {
            'confirmed': '✅ 예약완료',
            'pending': '⏳ 대기중',
            'completed': '✔️ 완료',
            'cancelled': '❌ 취소'
        };
        return map[status] || status;
    }
    
    function getStatusClass(status) {
        return `status-${status}`;
    }
    
    function getDayScheduleCount(dateStr) {
        return schedules.filter(s => s.date === dateStr).length;
    }
    
    function getSchedulesByDate(dateStr) {
        return schedules.filter(s => s.date === dateStr);
    }

    // ============================================
    //  로딩 표시
    // ============================================
    function showLoading(text = '로딩 중...') {
        const overlay = document.getElementById('loadingOverlay');
        const textEl = document.getElementById('loadingText');
        if (overlay) {
            if (textEl) textEl.textContent = text;
            overlay.classList.add('active');
        }
    }

    function hideLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) {
            overlay.classList.remove('active');
        }
    }

    // ============================================
    //  🔥 FIREBASE CRUD
    // ============================================

    async function loadSchedulesFromFirebase() {
        if (!currentUser) {
            console.log('⚠️ 로그인이 필요합니다.');
            return;
        }

        try {
            isLoading = true;
            showLoading('일정을 불러오는 중...');

            const q = query(
                collection(db, 'schedules'),
                where('guideId', '==', currentUser.uid)
            );
            
            const querySnapshot = await getDocs(q);
            schedules = [];
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                schedules.push({
                    id: doc.id,
                    guideId: data.guideId,
                    title: data.title || '',
                    date: data.date || '',
                    time: data.time || '',
                    customer: data.customer || '미정',
                    count: data.count || 0,
                    location: data.location || '미정',
                    status: data.status || 'confirmed',
                    memo: data.memo || '',
                    createdAt: data.createdAt,
                    updatedAt: data.updatedAt
                });
            });

            schedules.sort((a, b) => (a.date || '').localeCompare(b.date || ''));

            console.log(`✅ ${schedules.length}개의 일정을 불러왔습니다.`);
            
            renderCalendar();
            renderScheduleList();
            
        } catch (error) {
            console.error('❌ 일정 불러오기 실패:', error);
            alert('일정을 불러오는데 실패했습니다: ' + error.message);
        } finally {
            isLoading = false;
            hideLoading();
        }
    }

    async function saveScheduleToFirebase(scheduleData) {
        if (!currentUser) {
            alert('⚠️ 로그인이 필요합니다.');
            return null;
        }

        try {
            showLoading('저장 중...');
            
            const data = {
                guideId: currentUser.uid,
                title: scheduleData.title,
                date: scheduleData.date,
                time: scheduleData.time || '',
                customer: scheduleData.customer || '미정',
                count: scheduleData.count || 0,
                location: scheduleData.location || '미정',
                status: scheduleData.status || 'confirmed',
                memo: scheduleData.memo || '',
                updatedAt: Timestamp.now()
            };

            let docRef;
            
            if (scheduleData.id) {
                const docSnap = await getDocs(query(
                    collection(db, 'schedules'),
                    where('guideId', '==', currentUser.uid),
                    where('__name__', '==', scheduleData.id)
                ));
                
                if (docSnap.empty) {
                    alert('⚠️ 이 일정을 수정할 권한이 없습니다.');
                    return null;
                }
                
                docRef = doc(db, 'schedules', scheduleData.id);
                await updateDoc(docRef, data);
                console.log('✅ 일정 수정 완료:', scheduleData.id);
            } else {
                data.createdAt = Timestamp.now();
                docRef = await addDoc(collection(db, 'schedules'), data);
                console.log('✅ 새 일정 추가 완료:', docRef.id);
                scheduleData.id = docRef.id;
            }

            await loadSchedulesFromFirebase();
            return scheduleData;

        } catch (error) {
            console.error('❌ 저장 실패:', error);
            alert('저장에 실패했습니다: ' + error.message);
            return null;
        } finally {
            hideLoading();
        }
    }

    async function deleteScheduleFromFirebase(scheduleId) {
        if (!currentUser) {
            alert('⚠️ 로그인이 필요합니다.');
            return false;
        }

        if (!confirm('정말 이 일정을 삭제하시겠습니까?')) {
            return false;
        }

        try {
            showLoading('삭제 중...');
            
            const docSnap = await getDocs(query(
                collection(db, 'schedules'),
                where('guideId', '==', currentUser.uid),
                where('__name__', '==', scheduleId)
            ));
            
            if (docSnap.empty) {
                alert('⚠️ 이 일정을 삭제할 권한이 없습니다.');
                return false;
            }
            
            const docRef = doc(db, 'schedules', scheduleId);
            await deleteDoc(docRef);
            console.log('🗑️ 일정 삭제 완료:', scheduleId);
            
            await loadSchedulesFromFirebase();
            return true;

        } catch (error) {
            console.error('❌ 삭제 실패:', error);
            alert('삭제에 실패했습니다: ' + error.message);
            return false;
        } finally {
            hideLoading();
        }
    }

    // ============================================
    //  UI 렌더링 함수
    // ============================================
    
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarTitle');
        
        const year = currentViewDate.getFullYear();
        const month = currentViewDate.getMonth();
        
        title.textContent = `${year}년 ${month + 1}월`;
        
        const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
        let html = weekdays.map(day => 
            `<div class="calendar-weekday">${day}</div>`
        ).join('');
        
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();
        const today = getDateString(new Date());
        const selected = getDateString(selectedDate);
        
        for (let i = 0; i < firstDay; i++) {
            html += `<div class="calendar-day other-month"></div>`;
        }
        
        for (let day = 1; day <= lastDate; day++) {
            const dateObj = new Date(year, month, day);
            const dateStr = getDateString(dateObj);
            const isToday = dateStr === today;
            const isSelected = dateStr === selected;
            const count = getDayScheduleCount(dateStr);
            
            html += `
                <div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" 
                     onclick="window.selectDate('${dateStr}')">
                    <div class="day-number">${day}</div>
                    ${count > 0 ? `<div class="event-count">${count}건</div>` : ''}
                    ${count > 0 ? `<div class="event-dots">${'<div class="event-dot confirmed"></div>'.repeat(Math.min(count, 3))}</div>` : ''}
                </div>
            `;
        }
        
        grid.innerHTML = html;
    }
    
    function renderScheduleList() {
        const list = document.getElementById('scheduleList');
        const badge = document.getElementById('dateBadge');
        const dateStr = getDateString(selectedDate);
        
        badge.textContent = formatDateDisplay(dateStr);
        
        const daySchedules = getSchedulesByDate(dateStr);
        
        if (daySchedules.length === 0) {
            list.innerHTML = `
                <div class="schedule-empty">
                    <span class="empty-icon">📭</span>
                    <p>이 날짜에는 일정이 없습니다.</p>
                    <p style="font-size:13px; margin-top:4px;">새 일정을 추가해보세요!</p>
                </div>
            `;
            return;
        }
        
        daySchedules.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
        
        list.innerHTML = daySchedules.map(s => `
            <div class="schedule-item" onclick="window.editSchedule('${s.id}')">
                <div class="item-header">
                    <span class="item-title">${s.title}</span>
                    <span class="item-time">${s.time || '시간 미정'}</span>
                </div>
                <div class="item-details">
                    <span>👤 ${s.customer}</span>
                    <span>👥 ${s.count}명</span>
                    <span>📍 ${s.location}</span>
                    <span class="item-status ${getStatusClass(s.status)}">${getStatusText(s.status)}</span>
                </div>
            </div>
        `).join('');
    }

    // ============================================
    //  전역 함수 (window에 노출)
    // ============================================
    
    window.selectDate = function(dateStr) {
        const parts = dateStr.split('-');
        selectedDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        renderCalendar();
        renderScheduleList();
    };
    
    window.changeMonth = function(delta) {
        currentViewDate.setMonth(currentViewDate.getMonth() + delta);
        renderCalendar();
    };
    
    window.goToday = function() {
        const today = new Date();
        currentViewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        window.selectDate(getDateString(today));
    };
    
    window.openAddScheduleModal = function() {
        console.log('🔓 새 일정 추가 모달 열기');
        const modal = document.getElementById('scheduleModal');
        if (!modal) {
            console.error('❌ 모달 요소를 찾을 수 없습니다.');
            return;
        }
        
        document.getElementById('modalTitle').textContent = '✏️ 새 일정 추가';
        document.getElementById('editScheduleId').value = '';
        document.getElementById('schedTitle').value = '';
        document.getElementById('schedDate').value = getDateString(selectedDate);
        document.getElementById('schedTime').value = '';
        document.getElementById('schedCustomer').value = '';
        document.getElementById('schedCount').value = '';
        document.getElementById('schedLocation').value = '';
        document.getElementById('schedStatus').value = 'confirmed';
        document.getElementById('schedMemo').value = '';
        document.getElementById('deleteBtn').style.display = 'none';
        
        modal.classList.add('active');
        console.log('✅ 모달 열림');
    };
    
    window.editSchedule = function(id) {
        const s = schedules.find(item => item.id === id);
        if (!s) return;
        
        document.getElementById('modalTitle').textContent = '✏️ 일정 수정';
        document.getElementById('editScheduleId').value = id;
        document.getElementById('schedTitle').value = s.title || '';
        document.getElementById('schedDate').value = s.date || '';
        document.getElementById('schedTime').value = s.time || '';
        document.getElementById('schedCustomer').value = s.customer || '';
        document.getElementById('schedCount').value = s.count || '';
        document.getElementById('schedLocation').value = s.location || '';
        document.getElementById('schedStatus').value = s.status || 'confirmed';
        document.getElementById('schedMemo').value = s.memo || '';
        document.getElementById('deleteBtn').style.display = 'block';
        
        document.getElementById('scheduleModal').classList.add('active');
    };
    
    window.closeScheduleModal = function() {
        console.log('🔒 모달 닫기');
        document.getElementById('scheduleModal').classList.remove('active');
    };
    
    window.saveSchedule = async function() {
        console.log('💾 저장 시작');
        
        const id = document.getElementById('editScheduleId').value;
        const title = document.getElementById('schedTitle').value.trim();
        const date = document.getElementById('schedDate').value;
        const time = document.getElementById('schedTime').value;
        const customer = document.getElementById('schedCustomer').value.trim();
        const count = parseInt(document.getElementById('schedCount').value) || 0;
        const location = document.getElementById('schedLocation').value.trim();
        const status = document.getElementById('schedStatus').value;
        const memo = document.getElementById('schedMemo').value.trim();
        
        if (!title) {
            alert('⚠️ 투어 제목을 입력해주세요.');
            document.getElementById('schedTitle').focus();
            return;
        }
        if (!date) {
            alert('⚠️ 날짜를 선택해주세요.');
            document.getElementById('schedDate').focus();
            return;
        }
        
        const scheduleData = {
            id: id || undefined,
            title,
            date,
            time,
            customer: customer || '미정',
            count,
            location: location || '미정',
            status,
            memo
        };
        
        await saveScheduleToFirebase(scheduleData);
        window.closeScheduleModal();
    };
    
    window.deleteSchedule = async function() {
        const id = document.getElementById('editScheduleId').value;
        if (!id) return;
        await deleteScheduleFromFirebase(id);
        window.closeScheduleModal();
    };

    // ============================================
    //  🆕 이벤트 리스너 (버튼 연결 - 핵심!)
    // ============================================
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 DOM 로드 완료');
        
        // 1. 새 일정 추가 버튼
        const addBtn = document.getElementById('addScheduleBtn');
        if (addBtn) {
            addBtn.addEventListener('click', function() {
                console.log('🖱️ 새 일정 추가 버튼 클릭됨');
                window.openAddScheduleModal();
            });
        } else {
            console.error('❌ 추가 버튼을 찾을 수 없습니다.');
        }
        
        // 2. 취소 버튼
        const cancelBtn = document.getElementById('cancelBtn');
        if (cancelBtn) {
            cancelBtn.addEventListener('click', function() {
                window.closeScheduleModal();
            });
        }
        
        // 3. 저장 버튼
        const saveBtn = document.getElementById('saveBtn');
        if (saveBtn) {
            saveBtn.addEventListener('click', function() {
                window.saveSchedule();
            });
        }
        
        // 4. 삭제 버튼
        const deleteBtn = document.getElementById('deleteBtn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', function() {
                window.deleteSchedule();
            });
        }
        
        // 5. 이전 달 버튼
        const prevBtn = document.getElementById('prevMonthBtn');
        if (prevBtn) {
            prevBtn.addEventListener('click', function() {
                window.changeMonth(-1);
            });
        }
        
        // 6. 다음 달 버튼
        const nextBtn = document.getElementById('nextMonthBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', function() {
                window.changeMonth(1);
            });
        }
        
        // 7. 오늘 버튼
        const todayBtn = document.getElementById('todayBtn');
        if (todayBtn) {
            todayBtn.addEventListener('click', function() {
                window.goToday();
            });
        }
    });

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            window.closeScheduleModal();
        }
    });
    
    // 모달 외부 클릭 시 닫기
    document.getElementById('scheduleModal')?.addEventListener('click', function(e) {
        if (e.target === this) {
            window.closeScheduleModal();
        }
    });

    // ============================================
    //  INIT - Firebase 인증
    // ============================================
    onAuthStateChanged(auth, async user => {
        if (!user) {
            console.log('⚠️ 로그인이 필요합니다.');
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'AUTH_ERROR',
                    message: '로그인이 필요합니다.'
                }, '*');
            }
            if (window.parent === window) {
                window.location.href = '/login/guidelogin.html';
            }
            return;
        }

        currentUser = user;
        console.log('✅ 로그인 사용자:', currentUser.email);
        console.log('🔑 UID:', currentUser.uid);
        
        await loadSchedulesFromFirebase();
        
        if (window.parent !== window) {
            window.parent.postMessage({
                type: 'IFRAME_READY',
                uid: user.uid,
                email: user.email
            }, '*');
        }
    });

    console.log('📅 Schedule Management with Firebase loaded');
</script>
</body>
</html>
