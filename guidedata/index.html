<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Guide Dashboard (Conversational UI)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #1f2937;
    color: white;
    padding: 30px 20px;
    position: fixed;
    left: 0;
    top: 0;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}

.sidebar a:hover {
    color: #ffffff;
}

/* Main Content */
.main {
    margin-left: 260px;
    padding: 40px;
    width: calc(100% - 260px - 350px);
}

/* Chat Panel */
.chat-panel {
    width: 350px;
    height: 100vh;
    background: #ffffff;
    border-left: 1px solid #ddd;
    position: fixed;
    right: 0;
    top: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.chat-panel h3 {
    margin-bottom: 15px;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding-right: 10px;
}

.chat-input {
    display: flex;
    margin-top: 15px;
}

.chat-input input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.chat-input button {
    margin-left: 10px;
    padding: 12px 18px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* Dashboard Cards */
.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.card h2 {
    margin-bottom: 20px;
    font-size: 22px;
}

.info-row {
    margin-bottom: 10px;
    font-size: 16px;
}

/* Profile Box */
.reg-box {
    width: 900px;
    max-width: 100%;
    background: white;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

input, textarea, select {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

textarea {
    height: 120px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
}

button:hover {
    background: #005fcc;
}

.quick-links a {
    display: inline-block;
    margin-right: 12px;
    padding: 10px 16px;
    background: #0078ff;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
}

.quick-links a:hover {
    background: #005fcc;
}

#msg {
    color: red;
    margin-top: 10px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Guide Menu</h2>
    <a onclick="navigate('dashboard')">Home</a>
    <a onclick="navigate('schedule')">My Schedule</a>
    <a href="/guidedata/bookings.html">Bookings</a>
    <a href="/guidedata/messages.html">Messages</a>
    <a href="/guidedata/revenue.html">Revenue</a>
    <a onclick="navigate('profile')">Edit Profile</a>
</div>

<!-- Main SPA Container -->
<div class="main" id="app"></div>

<!-- Chat Panel -->
<div class="chat-panel">
    <h3>AI Assistant</h3>
    <div class="chat-box" id="chatBox"></div>

    <div class="chat-input">
        <input id="chatInput" placeholder="예: 내 프로필 보여줘">
        <button onclick="sendChat()">Send</button>
    </div>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
      authDomain: "guidelogin-b0053.firebaseapp.com",
      projectId: "guidelogin-b0053",
      storageBucket: "guidelogin-b0053.firebasestorage.app",
      messagingSenderId: "981519805247",
      appId: "1:981519805247:web:cc32682b177a4957c0818a",
      measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    let currentUser = null;

    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "guidelogin.html";
            return;
        }
        currentUser = user;
        navigate("dashboard");
    });

    /* ---------------- SPA ROUTER ---------------- */
    window.navigate = function(page) {
        if (page === "dashboard") loadDashboardPage();
        if (page === "schedule") loadSchedulePage();
        if (page === "profile") loadProfilePage();

        /* 기존 방식 */
        if (page === "bookings") window.location.href = "/guidedata/bookings.html";
        if (page === "messages") window.location.href = "/guidedata/messages.html";
        if (page === "revenue") window.location.href = "/guidedata/revenue.html";
    };

    /* ---------------- CHAT COMMANDS ---------------- */
    function sendChat() {
        const input = chatInput.value.trim();
        if (!input) return;

        chatBox.innerHTML += `<p><strong>You:</strong> ${input}</p>`;
        chatInput.value = "";

        if (input.includes("프로필")) navigate("profile");
        else if (input.includes("일정")) navigate("schedule");
        else if (input.includes("홈") || input.includes("대시보드")) navigate("dashboard");
        else chatBox.innerHTML += `<p><strong>AI:</strong> 이해했어요. 곧 더 많은 기능을 추가할게요.</p>`;
    }

    /* ---------------- DASHBOARD ---------------- */
    async function loadDashboardPage() {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);
        const g = snap.exists() ? snap.data() : {};

        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>Guide Information</h2>
                <div class="info-row"><strong>Name:</strong> ${g.name || ""}</div>
                <div class="info-row"><strong>Phone:</strong> ${g.phone || ""}</div>
                <div class="info-row"><strong>Nationality:</strong> ${g.nationality || ""}</div>
                <div class="info-row"><strong>Gender:</strong> ${g.gender || ""}</div>
                <div class="info-row"><strong>Languages:</strong> ${(g.languages || []).join(", ")}</div>
                <div class="info-row"><strong>Specialties:</strong> ${(g.specialties || []).join(", ")}</div>
                <div class="info-row"><strong>Regions:</strong> ${(g.regions || []).join(", ")}</div>
            </div>

            <div class="card">
                <h2>Today's Schedule</h2>
                <p>오늘 일정이 없습니다.</p>
            </div>

            <div class="card">
                <h2>Quick Actions</h2>
                <div class="quick-links">
                    <a onclick="navigate('schedule')">일정 관리</a>
                    <a onclick="navigate('profile')">프로필 수정</a>
                    <a href="/guidedata/bookings.html">예약 관리</a>
                </div>
            </div>
        `;
    }

    /* ---------------- SCHEDULE ---------------- */
    function loadSchedulePage() {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h2>Schedule 화면 준비 중</h2>
                <p>일정 기능은 다음 단계에서 완성해드릴게요.</p>
            </div>
        `;
    }

    /* ---------------- PROFILE 화면 ---------------- */
    async function loadProfilePage() {
        document.getElementById("app").innerHTML = `
            <div class="reg-box">
                <h2>Edit Profile</h2>

                <input id="name" placeholder="이름 또는 닉네임">
                <input id="phone" placeholder="전화번호">

                <label>국적</label>
                <select id="nationality">
                    <option value="South Korea">South Korea</option>
                    <option value="UAE">UAE</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                    <option value="India">India</option>
                    <option value="Philippines">Philippines</option>
                    <option value="Russia">Russia</option>
                    <option value="UK">UK</option>
                    <option value="USA">USA</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Other">Other</option>
                </select>

                <label>성별</label>
                <select id="gender">
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                    <option value="기타">기타</option>
                </select>

                <label>가능 언어</label>
                <select id="languages" multiple>
                    <option value="Korean">Korean</option>
                    <option value="English">English</option>
                    <option value="Arabic">Arabic</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Russian">Russian</option>
                    <option value="Filipino">Filipino</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                </select>

                <label>경력</label>
                <select id="experience">
                    <option value="1">1년</option>
                    <option value="2">2년</option>
                    <option value="3">3년</option>
                    <option value="5">5년</option>
                    <option value="7">7년</option>
                    <option value="10">10년</option>
                    <option value="15">15년</option>
                    <option value="20">20년</option>
                </select>

                <label>전문 분야</label>
                <select id="specialties" multiple>
                    <option value="문화/예술">문화/예술</option>
                    <option value="역사">역사</option>
                    <option value="사막 사파리">사막 사파리</option>
                    <option value="사진 촬영">사진 촬영</option>
                    <option value="쇼핑">쇼핑</option>
                    <option value="미식">미식</option>
                    <option value="VIP 의전">VIP 의전</option>
                    <option value="가족 여행">가족 여행</option>
                    <option value="비즈니스 출장">비즈니스 출장</option>
                </select>

                <label>활동 지역</label>
                <select id="regions" multiple>
                    <option value="Dubai Marina">Dubai Marina</option>
                    <option value="Downtown Dubai">Downtown Dubai</option>
                    <option value="Deira">Deira</option>
                    <option value="Jumeirah">Jumeirah</option>
                    <option value="Abu Dhabi">Abu Dhabi</option>
                    <option value="Sharjah">Sharjah</option>
                </select>

                <input id="price_hour" placeholder="시간당 요금 (AED)">
                <input id="price_day" placeholder="하루 요금 (AED)">

                <textarea id="bio" placeholder="가이드 소개"></textarea>

                <button onclick="updateGuide()">정보 수정</button>
                <p id="msg"></p>
            </div>
        `;

        loadProfile();
    }

    /* ---------------- 데이터 로딩 ---------------- */
    async function loadProfile() {
        const docRef = doc(db, "guides", currentUser.uid);
        const snap = await getDoc(docRef);

        if (!snap.exists()) {
            msg.innerText = "가이드 정보를 찾을 수 없습니다.";
            return;
        }

        const g = snap.data();

        name.value = g.name || "";
        phone.value = g.phone || "";
        nationality.value = g.nationality || "South Korea";
        gender.value = g.gender || "남성";
        experience.value = g.experience || "1";
        price_hour.value = g.price_hour || "";
        price_day.value = g.price_day || "";
        bio.value = g.bio || "";

        Array.from(languages.options).forEach(opt => {
            if (g.languages?.includes(opt.value)) opt.selected = true;
        });

        Array.from(specialties.options).forEach(opt => {
            if (g.specialties?.includes(opt.value)) opt.selected = true;
        });

        Array.from(regions.options).forEach(opt => {
            if (g.regions?.includes(opt.value)) opt.selected = true;
        });
    }

    /* ---------------- 데이터 업데이트 ---------------- */
    window.updateGuide = async function() {
        const specialtiesArr = Array.from(specialties.selectedOptions).map(opt => opt.value);
        const regionsArr = Array.from(regions.selectedOptions).map(opt => opt.value);
        const languagesArr = Array.from(languages.selectedOptions).map(opt => opt.value);

        try {
            await updateDoc(doc(db, "guides", currentUser.uid), {
                name: name.value,
                phone: phone.value,
                nationality: nationality.value,
                gender: gender.value,
                languages: languagesArr,
                experience: experience.value,
                specialties: specialtiesArr,
                regions: regionsArr,
                price_hour: price_hour.value,
                price_day: price_day.value,
