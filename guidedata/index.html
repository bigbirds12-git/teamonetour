<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Platform – Conversational Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
}

/* ===== HERO TOP NAV ===== */
.hero-nav {
    width: 100%;
    background: #ffffff;
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.hero-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.hero-left a {
    padding: 8px 16px;
    font-size: 15px;
    font-weight: 600;
    color: #4b5563;
    text-decoration: none;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
}

.hero-left a:hover {
    color: #0078ff;
    background: #f0f7ff;
}

.hero-left a.active {
    color: #0078ff;
    background: #e8f0fe;
}

.hero-right {
    font-size: 20px;
    font-weight: 700;
    color: #0078ff;
    letter-spacing: -0.5px;
}

.hero-right span {
    font-weight: 300;
    color: #6b7280;
}

/* ===== MAIN LAYOUT ===== */
.layout {
    display: flex;
    margin-top: 72px;
    padding: 32px 40px 40px 40px;
    min-height: calc(100vh - 72px);
}

/* ===== DASHBOARD CENTER ===== */
.dashboard {
    flex: 1;
    padding-right: 40px;
    min-width: 0;
}

.dashboard h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1a1a2e;
}

.dashboard .subtitle {
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 28px;
}

.user-greeting {
    background: linear-gradient(135deg, #e8f0fe 0%, #f0f7ff 100%);
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: #1a3a6e;
}

.user-greeting .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0078ff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
}

/* ===== CARD GRID ===== */
.card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 28px 24px;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #f0f2f5;
    position: relative;
    overflow: hidden;
}

.card::after {
    content: '→';
    position: absolute;
    right: 20px;
    bottom: 20px;
    font-size: 20px;
    color: #cbd5e1;
    transition: all 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,120,255,0.12);
    border-color: #0078ff;
}

.card:hover::after {
    color: #0078ff;
    transform: translateX(4px);
}

.card .icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
}

.card h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #1a1a2e;
}

.card p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
}

/* ===== AI CHAT PANEL ===== */
.chat-panel {
    width: 380px;
    min-width: 380px;
    background: #ffffff;
    border-left: 1px solid #e5e7eb;
    padding: 24px 20px 20px 20px;
    height: calc(100vh - 72px);
    position: sticky;
    top: 72px;
    display: flex;
    flex-direction: column;
}

.chat-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f2f5;
}

.chat-panel-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
}

.chat-status {
    font-size: 12px;
    color: #10b981;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.chat-status::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
    animation: pulse-dot 1.5s infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding-right: 8px;
    margin-bottom: 12px;
    min-height: 0;
}

.chat-box::-webkit-scrollbar {
    width: 4px;
}

.chat-box::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}

.chat-message {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 92%;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 14px;
    animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-message.user {
    background: #0078ff;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.chat-message.ai {
    background: #f0f4f9;
    color: #1a1a2e;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

.chat-message .msg-label {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.7;
    margin-bottom: 2px;
    display: block;
}

.chat-message.user .msg-label {
    text-align: right;
}

.chat-message .timestamp {
    font-size: 10px;
    opacity: 0.5;
    margin-top: 4px;
    display: block;
}

.chat-message.user .timestamp {
    text-align: right;
}

.chat-empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 40px 10px;
}

.chat-empty .big-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
}

.chat-empty .hint {
    font-size: 13px;
    color: #d1d5db;
    margin-top: 8px;
}

/* ===== CHAT INPUT ===== */
.chat-input-wrapper {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
}

.chat-input-wrapper input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
    background: #f9fafb;
}

.chat-input-wrapper input:focus {
    border-color: #0078ff;
    background: white;
    box-shadow: 0 0 0 3px rgba(0,120,255,0.1);
}

.chat-input-wrapper input::placeholder {
    color: #9ca3af;
}

.chat-input-wrapper button {
    padding: 12px 22px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    white-space: nowrap;
}

.chat-input-wrapper button:hover {
    background: #0066dd;
    transform: scale(1.02);
}

.chat-input-wrapper button:active {
    transform: scale(0.96);
}

.chat-input-wrapper button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* ===== COMMAND HINT ===== */
.command-hint {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0f2f5;
}

.command-hint .tag {
    font-size: 11px;
    padding: 4px 10px;
    background: #f0f4f9;
    border-radius: 12px;
    color: #4b5563;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
}

.command-hint .tag:hover {
    background: #e8f0fe;
    border-color: #0078ff;
    color: #0078ff;
}

/* ===== LOADING SPINNER ===== */
.loading-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e5e7eb;
    border-top-color: #0078ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) {
    .card-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 992px) {
    .layout {
        flex-direction: column;
        padding: 20px;
    }

    .dashboard {
        padding-right: 0;
        margin-bottom: 24px;
    }

    .chat-panel {
        width: 100%;
        min-width: unset;
        height: 440px;
        position: relative;
        top: 0;
        border-left: none;
        border-top: 1px solid #e5e7eb;
        padding-top: 20px;
    }

    .card-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 640px) {
    .hero-nav {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 8px;
    }

    .hero-left {
        flex-wrap: wrap;
    }

    .hero-left a {
        font-size: 13px;
        padding: 6px 12px;
    }

    .hero-right {
        font-size: 16px;
    }

    .dashboard h1 {
        font-size: 22px;
    }

    .card-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .card {
        padding: 20px;
    }

    .chat-panel {
        height: 380px;
        padding: 16px;
    }

    .chat-input-wrapper input {
        font-size: 13px;
        padding: 10px 14px;
    }

    .chat-input-wrapper button {
        padding: 10px 16px;
        font-size: 13px;
    }
}
</style>
</head>
<body>

<!-- ===== HERO TOP NAV ===== -->
<nav class="hero-nav">
    <div class="hero-left">
        <a class="active" data-page="dashboard" onclick="navigate('dashboard')">🏠 Home</a>
        <a data-page="chat" onclick="navigate('chat')">💬 AI Chat</a>
        <a data-page="settings" onclick="navigate('settings')">⚙️ Settings</a>
    </div>
    <div class="hero-right">Guide <span>Platform</span></div>
</nav>

<!-- ===== MAIN LAYOUT ===== -->
<div class="layout">

    <!-- ===== DASHBOARD CENTER ===== -->
    <main class="dashboard" id="app">
        <!-- SPA 콘텐츠가 여기에 렌더링됩니다 -->
    </main>

    <!-- ===== AI CHAT PANEL ===== -->
    <aside class="chat-panel">
        <div class="chat-panel-header">
            <h2>🤖 AI Assistant</h2>
            <span class="chat-status">Online</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="chat-empty">
                <span class="big-icon">👋</span>
                <p>안녕하세요! 무엇을 도와드릴까요?</p>
                <p class="hint">명령어를 입력하거나 태그를 클릭해보세요</p>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <input 
                id="chatInput" 
                type="text" 
                placeholder="명령어를 입력하세요 (예: 프로필 보여줘)"
                onkeydown="if(event.key==='Enter') sendChat()"
                autocomplete="off"
            >
            <button onclick="sendChat()" id="sendBtn">전송</button>
        </div>

        <div class="command-hint">
            <span class="tag" onclick="quickCommand('프로필')">👤 프로필</span>
            <span class="tag" onclick="quickCommand('일정')">📅 일정</span>
            <span class="tag" onclick="quickCommand('예약')">📋 예약</span>
            <span class="tag" onclick="quickCommand('메시지')">✉️ 메시지</span>
            <span class="tag" onclick="quickCommand('수익')">💰 수익</span>
            <span class="tag" onclick="quickCommand('홈')">🏠 홈</span>
        </div>
    </aside>

</div>

<!-- ===== Firebase + SPA Router ===== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
        apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
        authDomain: "guidelogin-b0053.firebaseapp.com",
        projectId: "guidelogin-b0053",
        storageBucket: "guidelogin-b0053.firebasestorage.app",
        messagingSenderId: "981519805247",
        appId: "1:981519805247:web:cc32682b177a4957c0818a",
        measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    let currentUser = null;
    let currentPage = 'dashboard';

    // ===== Auth State =====
    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "/login/guidelogin.html";
            return;
        }
        currentUser = user;
        await loadUserProfile();
        navigate('dashboard');
    });

    // ===== Load User Profile =====
    async function loadUserProfile() {
        if (!currentUser) return;
        try {
            const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
            if (userDoc.exists()) {
                window.userProfile = userDoc.data();
            }
        } catch (error) {
            console.error('프로필 로드 실패:', error);
        }
    }

    // ===== Get User Display Name =====
    function getUserDisplayName() {
        if (window.userProfile?.name) return window.userProfile.name;
        if (currentUser?.displayName) return currentUser.displayName;
        if (currentUser?.email) return currentUser.email.split('@')[0];
        return '사용자';
    }

    function getUserInitial() {
        const name = getUserDisplayName();
        return name.charAt(0).toUpperCase();
    }

    // ============================================
    //  SPA ROUTER
    // ============================================
    window.navigate = function(page) {
        currentPage = page;
        
        // 네비게이션 active 상태 업데이트
        document.querySelectorAll('.hero-left a').forEach(el => {
            el.classList.toggle('active', el.dataset.page === page);
        });

        // 페이지 로드
        switch(page) {
            case 'dashboard': loadDashboard(); break;
            case 'chat': loadChatIntro(); break;
            case 'settings': loadSettings(); break;
            case 'schedule': loadSchedule(); break;
            case 'profile': loadProfile(); break;
            case 'bookings': 
            case 'messages':
            case 'revenue':
                // 외부 페이지로 이동
                window.location.href = `/guidedata/${page}.html`;
                return;
            default: loadDashboard();
        }
    };

    // ============================================
    //  PAGE LOADERS
    // ============================================
    function showLoading() {
        document.getElementById('app').innerHTML = `
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        `;
    }

    function loadDashboard() {
        const name = getUserDisplayName();
        const initial = getUserInitial();
        
        document.getElementById('app').innerHTML = `
            <h1>📊 대시보드</h1>
            <p class="subtitle">가이드 활동을 한눈에 확인하세요</p>

            <div class="user-greeting">
                <div class="avatar">${initial}</div>
                <span>👋 안녕하세요, <strong>${name}</strong>님! 오늘도 좋은 하루 되세요</span>
            </div>

            <div class="card-grid">
                <div class="card" onclick="navigate('schedule')">
                    <span class="icon">📅</span>
                    <h3>내 일정</h3>
                    <p>오늘의 투어 일정을 확인하고 관리하세요</p>
                </div>

                <div class="card" onclick="navigate('bookings')">
                    <span class="icon">📋</span>
                    <h3>예약 목록</h3>
                    <p>고객 예약 현황을 확인하세요</p>
                </div>

                <div class="card" onclick="navigate('messages')">
                    <span class="icon">✉️</span>
                    <h3>메시지</h3>
                    <p>고객과의 대화를 확인하세요</p>
                </div>

                <div class="card" onclick="navigate('profile')">
                    <span class="icon">👤</span>
                    <h3>프로필 수정</h3>
                    <p>가이드 정보를 업데이트하세요</p>
                </div>

                <div class="card" onclick="navigate('revenue')">
                    <span class="icon">💰</span>
                    <h3>수익 현황</h3>
                    <p>월별 수익을 확인하세요</p>
                </div>

                <div class="card" onclick="handleLogout()" style="border-color: #fee2e2;">
                    <span class="icon">🚪</span>
                    <h3 style="color: #dc2626;">로그아웃</h3>
                    <p>안전하게 로그아웃합니다</p>
                </div>
            </div>
        `;
    }

    function loadChatIntro() {
        document.getElementById('app').innerHTML = `
            <h1>💬 AI 채팅</h1>
            <p class="subtitle">오른쪽 패널에서 AI와 대화하며 기능을 실행하세요</p>
            <div style="background: white; padding: 24px; border-radius: 16px; margin-top: 16px; border: 1px solid #e5e7eb;">
                <h3 style="margin-bottom: 12px;">📌 사용 가능한 명령어</h3>
                <ul style="list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">👤 프로필 보여줘</li>
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">📅 내 일정 보여줘</li>
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">📋 예약 목록 보여줘</li>
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">✉️ 메시지 확인해줘</li>
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">💰 수익 현황 알려줘</li>
                    <li style="padding: 8px 12px; background: #f0f4f9; border-radius: 8px;">🏠 홈으로 가줘</li>
                </ul>
            </div>
        `;
    }

    function loadSettings() {
        document.getElementById('app').innerHTML = `
            <h1>⚙️ 설정</h1>
            <p class="subtitle">환경 설정을 관리합니다</p>
            <div style="background: white; padding: 24px; border-radius: 16px; border: 1px solid #e5e7eb;">
                <p style="color: #6b7280;">설정 기능은 곧 업데이트될 예정입니다.</p>
                <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 400px;">
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f2f5;">
                        <span>🔔 알림</span>
                        <span style="color: #10b981;">● 활성화</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f2f5;">
                        <span>🌙 다크 모드</span>
                        <span style="color: #6b7280;">준비 중</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding: 12px 0;">
                        <span>🌐 언어</span>
                        <span style="color: #6b7280;">한국어</span>
                    </div>
                </div>
            </div>
        `;
    }

    function loadSchedule() {
        document.getElementById('app').innerHTML = `
            <h1>📅 내 일정</h1>
            <p class="subtitle">투어 일정을 관리하세요</p>
            <div style="background: white; padding: 24px; border-radius: 16px; border: 1px solid #e5e7eb;">
                <p style="color: #6b7280;">📌 오늘의 일정이 없습니다.</p>
                <p style="font-size: 14px; color: #9ca3af; margin-top: 8px;">새로운 투어 일정을 추가하려면 관리자에게 문의하세요.</p>
            </div>
        `;
    }

    function loadProfile() {
        const name = getUserDisplayName();
        const email = currentUser?.email || '등록된 이메일 없음';
        const initial = getUserInitial();

        document.getElementById('app').innerHTML = `
            <h1>👤 프로필 수정</h1>
            <p class="subtitle">가이드 프로필 정보를 관리하세요</p>
            <div style="background: white; padding: 28px; border-radius: 16px; border: 1px solid #e5e7eb; max-width: 500px;">
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
                    <div style="width: 72px; height: 72px; border-radius: 50%; background: #0078ff; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700;">${initial}</div>
                    <div>
                        <h3 style="font-size: 20px;">${name}</h3>
                        <p style="color: #6b7280; font-size: 14px;">${email}</p>
                    </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label style="font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; color: #4b5563;">이름</label>
                        <input type="text" value="${name}" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 14px; background: #f9fafb;">
                    </div>
                    <div>
                        <label style="font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; color: #4b5563;">전문 분야</label>
                        <input type="text" placeholder="예: 역사 투어, 음식 투어" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 14px;">
                    </div>
                    <div>
                        <label style="font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; color: #4b5563;">소개</label>
                        <textarea rows="3" placeholder="자기소개를 입력하세요" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 14px; resize: vertical; font-family: inherit;"></textarea>
                    </div>
                    <button style="padding: 12px; background: #0078ff; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#0066dd'" onmouseout="this.style.background='#0078ff'">
                        💾 저장하기
                    </button>
                </div>
            </div>
        `;
    }

    // ===== Logout Handler =====
    window.handleLogout = async function() {
        if (confirm('정말 로그아웃하시겠습니까?')) {
            try {
                await signOut(auth);
                window.location.href = '/login/guidelogin.html';
            } catch (error) {
                alert('로그아웃 중 오류가 발생했습니다: ' + error.message);
            }
        }
    };

    // ============================================
    //  CHAT SYSTEM
    // ============================================
    function getChatBox() {
        return document.getElementById('chatBox');
    }

    function getChatInput() {
        return document.getElementById('chatInput');
    }

    function addMessage(text, sender) {
        const box = getChatBox();
        if (!box) return;

        // 빈 상태 메시지 제거
        const emptyMsg = box.querySelector('.chat-empty');
        if (emptyMsg) emptyMsg.remove();

        const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = `chat-message ${sender}`;
        div.innerHTML = `
            <span class="msg-label">${sender === 'user' ? '👤 You' : '🤖 AI'}</span>
            ${text}
            <span class="timestamp">${time}</span>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(text) {
        const box = getChatBox();
        if (!box) return;
        const div = document.createElement('div');
        div.style.cssText = 'text-align: center; font-size: 12px; color: #9ca3af; padding: 8px 0;';
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // ===== Quick Command =====
    window.quickCommand = function(cmd) {
        const input = getChatInput();
        if (input) {
            input.value = cmd;
            sendChat();
        }
    };

    // ===== Send Chat =====
    window.sendChat = function() {
        const input = getChatInput();
        const btn = document.getElementById('sendBtn');
        if (!input) return;

        const text = input.value.trim();
        if (!text) {
            input.focus();
            return;
        }

        // 사용자 메시지 추가
        addMessage(text, 'user');
        input.value = '';
        input.focus();

        // 버튼 비활성화 (중복 전송 방지)
        if (btn) btn.disabled = true;

        // AI 응답 (약간의 딜레이로 실제 대화처럼)
        setTimeout(() => {
            processCommand(text);
            if (btn) btn.disabled = false;
        }, 300);
    };

    function processCommand(text) {
        const lower = text.toLowerCase();

        // 명령어 매핑
        const commandMap = {
            '프로필': 'profile',
            '내 프로필': 'profile',
            '프로필 보여줘': 'profile',
            '나의 프로필': 'profile',
            '일정': 'schedule',
            '내 일정': 'schedule',
            '일정 보여줘': 'schedule',
            '일정 확인': 'schedule',
            '예약': 'bookings',
            '예약 목록': 'bookings',
            '예약 확인': 'bookings',
            '메시지': 'messages',
            '쪽지': 'messages',
            '수익': 'revenue',
            '수익 현황': 'revenue',
            '홈': 'dashboard',
            '대시보드': 'dashboard',
            '메인': 'dashboard',
            '설정': 'settings',
            '세팅': 'settings'
        };

        let matched = false;

        for (const [keyword, page] of Object.entries(commandMap)) {
            if (lower.includes(keyword)) {
                // 외부 페이지는 네비게이션 처리
                if (['bookings', 'messages', 'revenue'].includes(page)) {
                    addMessage(`📂 "${page}" 페이지로 이동합니다...`, 'ai');
                    setTimeout(() => navigate(page), 500);
                } else {
                    addMessage(`✅ "${page}" 페이지로 이동합니다.`, 'ai');
                    setTimeout(() => navigate(page), 300);
                }
                matched = true;
                break;
            }
        }

        if (!matched) {
            // 도움말 응답
            const helpText = `
                죄송합니다. "${text}" 명령을 이해하지 못했어요.<br>
                <strong>사용 가능한 명령어:</strong><br>
                👤 프로필 · 📅 일정 · 📋 예약 · ✉️ 메시지 · 💰 수익 · 🏠 홈
            `;
            addMessage(helpText, 'ai');
        }
    }

    // ===== Enter Key =====
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.id === 'chatInput') {
            e.preventDefault();
            sendChat();
        }
    });

    // ============================================
    //  INIT - 첫 로드 시 대시보드 표시
    // ============================================
    // navigate는 onAuthStateChanged에서 호출되므로 여기서는 추가 호출하지 않음
    console.log('🚀 Guide Platform initialized');

</script>

</body>
</html>
