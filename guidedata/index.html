<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Platform – Conversational Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* ===== 기존 스타일 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
}

/* ===== HERO TOP NAV ===== */
.hero-nav {
    width: 100%;
    background: #ffffff;
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.hero-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.hero-left a {
    padding: 8px 16px;
    font-size: 15px;
    font-weight: 600;
    color: #4b5563;
    text-decoration: none;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
}

.hero-left a:hover {
    color: #0078ff;
    background: #f0f7ff;
}

.hero-left a.active {
    color: #0078ff;
    background: #e8f0fe;
}

.hero-right {
    font-size: 20px;
    font-weight: 700;
    color: #0078ff;
    letter-spacing: -0.5px;
}

.hero-right span {
    font-weight: 300;
    color: #6b7280;
}

/* ===== MAIN LAYOUT ===== */
.layout {
    display: flex;
    margin-top: 72px;
    padding: 32px 40px 40px 40px;
    min-height: calc(100vh - 72px);
}

/* ===== DASHBOARD CENTER ===== */
.dashboard {
    flex: 1;
    padding-right: 40px;
    min-width: 0;
}

.dashboard h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1a1a2e;
}

.dashboard .subtitle {
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 28px;
}

.user-greeting {
    background: linear-gradient(135deg, #e8f0fe 0%, #f0f7ff 100%);
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: #1a3a6e;
}

.user-greeting .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0078ff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
}

/* ===== CARD GRID ===== */
.card-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 28px 24px;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #f0f2f5;
    position: relative;
    overflow: hidden;
}

.card::after {
    content: '→';
    position: absolute;
    right: 20px;
    bottom: 20px;
    font-size: 20px;
    color: #cbd5e1;
    transition: all 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(0,120,255,0.12);
    border-color: #0078ff;
}

.card:hover::after {
    color: #0078ff;
    transform: translateX(4px);
}

.card .icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
}

.card h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #1a1a2e;
}

.card p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
}

/* ===== AI CHAT PANEL ===== */
.chat-panel {
    width: 380px;
    min-width: 380px;
    background: #ffffff;
    border-left: 1px solid #e5e7eb;
    padding: 24px 20px 20px 20px;
    height: calc(100vh - 72px);
    position: sticky;
    top: 72px;
    display: flex;
    flex-direction: column;
}

.chat-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f2f5;
}

.chat-panel-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a2e;
}

.chat-status {
    font-size: 12px;
    color: #10b981;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

.chat-status::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
    animation: pulse-dot 1.5s infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding-right: 8px;
    margin-bottom: 12px;
    min-height: 0;
}

.chat-box::-webkit-scrollbar {
    width: 4px;
}

.chat-box::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
}

.chat-box::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
}

.chat-message {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 92%;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 14px;
    animation: fadeInUp 0.3s ease;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.chat-message.user {
    background: #0078ff;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.chat-message.ai {
    background: #f0f4f9;
    color: #1a1a2e;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

.chat-message .msg-label {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.7;
    margin-bottom: 2px;
    display: block;
}

.chat-message.user .msg-label {
    text-align: right;
}

.chat-message .timestamp {
    font-size: 10px;
    opacity: 0.5;
    margin-top: 4px;
    display: block;
}

.chat-message.user .timestamp {
    text-align: right;
}

.chat-empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 40px 10px;
}

.chat-empty .big-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
}

.chat-empty .hint {
    font-size: 13px;
    color: #d1d5db;
    margin-top: 8px;
}

/* ===== CHAT INPUT ===== */
.chat-input-wrapper {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
}

.chat-input-wrapper input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
    background: #f9fafb;
}

.chat-input-wrapper input:focus {
    border-color: #0078ff;
    background: white;
    box-shadow: 0 0 0 3px rgba(0,120,255,0.1);
}

.chat-input-wrapper input::placeholder {
    color: #9ca3af;
}

.chat-input-wrapper button {
    padding: 12px 22px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    white-space: nowrap;
}

.chat-input-wrapper button:hover {
    background: #0066dd;
    transform: scale(1.02);
}

.chat-input-wrapper button:active {
    transform: scale(0.96);
}

.chat-input-wrapper button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* ===== COMMAND HINT ===== */
.command-hint {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0f2f5;
}

.command-hint .tag {
    font-size: 11px;
    padding: 4px 10px;
    background: #f0f4f9;
    border-radius: 12px;
    color: #4b5563;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
}

.command-hint .tag:hover {
    background: #e8f0fe;
    border-color: #0078ff;
    color: #0078ff;
}

/* ============================================================
   ===== MODAL STYLES =====
   ============================================================ */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal-content {
    background: white;
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 0;
    box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    animation: modalSlideIn 0.3s ease;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    background: white;
    border-radius: 20px 20px 0 0;
    z-index: 1;
}

.modal-header h2 {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
}

.modal-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #6b7280;
    padding: 0 8px;
    transition: all 0.2s;
    line-height: 1;
}

.modal-close:hover {
    color: #dc2626;
    transform: rotate(90deg);
}

.modal-body {
    padding: 24px;
}

.modal-body iframe {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 8px;
}

/* ===== 로딩 스피너 ===== */
.loading-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e5e7eb;
    border-top-color: #0078ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1200px) {
    .card-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 992px) {
    .layout {
        flex-direction: column;
        padding: 20px;
    }

    .dashboard {
        padding-right: 0;
        margin-bottom: 24px;
    }

    .chat-panel {
        width: 100%;
        min-width: unset;
        height: 440px;
        position: relative;
        top: 0;
        border-left: none;
        border-top: 1px solid #e5e7eb;
        padding-top: 20px;
    }

    .card-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 640px) {
    .hero-nav {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 8px;
    }

    .hero-left {
        flex-wrap: wrap;
    }

    .hero-left a {
        font-size: 13px;
        padding: 6px 12px;
    }

    .hero-right {
        font-size: 16px;
    }

    .dashboard h1 {
        font-size: 22px;
    }

    .card-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .card {
        padding: 20px;
    }

    .chat-panel {
        height: 380px;
        padding: 16px;
    }

    .modal-content {
        max-width: 100%;
        max-height: 95vh;
        margin: 10px;
    }

    .modal-body iframe {
        height: 450px;
    }
}
</style>
</head>
<body>

<!-- ===== HERO TOP NAV ===== -->
<nav class="hero-nav">
    <div class="hero-left">
        <a class="active" data-page="dashboard" onclick="navigate('dashboard')">🏠 Home</a>
        <a data-page="chat" onclick="navigate('chat')">💬 AI Chat</a>
        <a data-page="settings" onclick="navigate('settings')">⚙️ Settings</a>
    </div>
    <div class="hero-right">Guide <span>Platform</span></div>
</nav>

<!-- ===== MAIN LAYOUT ===== -->
<div class="layout">

    <!-- ===== DASHBOARD CENTER ===== -->
    <main class="dashboard" id="app">
        <!-- SPA 콘텐츠가 여기에 렌더링됩니다 -->
    </main>

    <!-- ===== AI CHAT PANEL ===== -->
    <aside class="chat-panel">
        <div class="chat-panel-header">
            <h2>🤖 AI Assistant</h2>
            <span class="chat-status">Online</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="chat-empty">
                <span class="big-icon">👋</span>
                <p>안녕하세요! 무엇을 도와드릴까요?</p>
                <p class="hint">명령어를 입력하거나 태그를 클릭해보세요</p>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <input 
                id="chatInput" 
                type="text" 
                placeholder="명령어를 입력하세요 (예: 프로필 보여줘)"
                onkeydown="if(event.key==='Enter') sendChat()"
                autocomplete="off"
            >
            <button onclick="sendChat()" id="sendBtn">전송</button>
        </div>

        <div class="command-hint">
            <span class="tag" onclick="quickCommand('프로필')">👤 프로필</span>
            <span class="tag" onclick="quickCommand('일정')">📅 일정</span>
            <span class="tag" onclick="quickCommand('예약')">📋 예약</span>
            <span class="tag" onclick="quickCommand('메시지')">✉️ 메시지</span>
            <span class="tag" onclick="quickCommand('수익')">💰 수익</span>
            <span class="tag" onclick="quickCommand('홈')">🏠 홈</span>
        </div>
    </aside>

</div>

<!-- ============================================================
     MODAL (iframe으로 guide-registration.html 로드)
     ============================================================ -->
<div class="modal-overlay" id="profileModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>👤 프로필 수정</h2>
            <button class="modal-close" onclick="closeProfileModal()">×</button>
        </div>
        <div class="modal-body">
            <iframe 
                id="profileIframe"
                src="/guidedata/guide-registration.html" 
                loading="lazy"
            ></iframe>
            <div id="iframeLoading" style="text-align:center; padding:40px; color:#6b7280;">
                <div class="spinner" style="margin:0 auto 16px;"></div>
                <p>프로필 정보를 불러오는 중...</p>
            </div>
        </div>
    </div>
</div>

<!-- ===== Firebase + SPA Router ===== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
        apiKey: "AIzaSyCgOSQsv_MRdaqrW4wJw0q2QY6wXZ-azQs",
        authDomain: "guidelogin-b0053.firebaseapp.com",
        projectId: "guidelogin-b0053",
        storageBucket: "guidelogin-b0053.firebasestorage.app",
        messagingSenderId: "981519805247",
        appId: "1:981519805247:web:cc32682b177a4957c0818a",
        measurementId: "G-2VR4TS6JND"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    let currentUser = null;
    let currentPage = 'dashboard';

    // ===== Auth State =====
    onAuthStateChanged(auth, async user => {
        if (!user) {
            window.location.href = "/login/guidelogin.html";
            return;
        }
        currentUser = user;
        await loadUserProfile();
        navigate('dashboard');
    });

    // ===== Load User Profile =====
    async function loadUserProfile() {
        if (!currentUser) return;
        try {
            const guideDoc = await getDoc(doc(db, 'guides', currentUser.uid));
            if (guideDoc.exists()) {
                window.userProfile = guideDoc.data();
            } else {
                const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
                if (userDoc.exists()) {
                    window.userProfile = userDoc.data();
                }
            }
        } catch (error) {
            console.error('프로필 로드 실패:', error);
        }
    }

    // ===== Get User Display Name =====
    function getUserDisplayName() {
        if (window.userProfile?.name) return window.userProfile.name;
        if (currentUser?.displayName) return currentUser.displayName;
        if (currentUser?.email) return currentUser.email.split('@')[0];
        return '사용자';
    }

    function getUserInitial() {
        const name = getUserDisplayName();
        return name.charAt(0).toUpperCase();
    }

    // ============================================
    //  MODAL CONTROLS (전역으로 노출 - 중요!)
    // ============================================
    window.openProfileModal = function() {
        const modal = document.getElementById('profileModal');
        const iframe = document.getElementById('profileIframe');
        const loading = document.getElementById('iframeLoading');
        
        console.log('🔓 프로필 모달 열기');
        
        if (loading) loading.style.display = 'block';
        if (modal) {
            modal.classList.add('active');
            modal.style.display = 'flex';
        }
        document.body.style.overflow = 'hidden';
        
        if (iframe) {
            iframe.src = iframe.src;
        }
    };

    window.closeProfileModal = function() {
        const modal = document.getElementById('profileModal');
        const iframe = document.getElementById('profileIframe');
        
        console.log('🔒 모달 닫기 실행');
        
        if (modal) {
            modal.classList.remove('active');
            modal.style.display = 'none';
        }
        
        document.body.style.overflow = '';
        
        if (iframe) {
            setTimeout(() => {
                iframe.src = 'about:blank';
            }, 300);
        }
    };

    // ============================================
    //  IFRAME MESSAGE HANDLER (전역으로 노출)
    // ============================================
    window.handleIframeMessage = function(event) {
        const data = event.data;
        
        console.log('📨 부모창 메시지 수신:', data);
        
        if (!data || typeof data !== 'object') return;
        
        switch(data.type) {
            case 'PROFILE_SAVED':
                console.log('✅ 프로필 저장 완료:', data.data);
                
                if (data.data) {
                    window.userProfile = data.data;
                }
                
                loadDashboard();
                addMessage('✅ 프로필이 성공적으로 저장되었습니다!', 'ai');
                closeProfileModal();
                break;
                
            case 'CLOSE_MODAL':
            case 'CLOSE_MODAL_FORCE':
                console.log('🔒 모달 닫기 요청 수신 (type: ' + data.type + ')');
                closeProfileModal();
                break;
                
            case 'IFRAME_READY':
                console.log('✅ iframe 준비 완료:', data);
                const loading = document.getElementById('iframeLoading');
                if (loading) loading.style.display = 'none';
                break;
                
            default:
                console.log('📨 알 수 없는 메시지 타입:', data.type);
                break;
        }
    };

    // ===== 메시지 리스너 등록 =====
    window.addEventListener('message', window.handleIframeMessage);

    // ============================================
    //  SPA ROUTER
    // ============================================
    window.navigate = function(page) {
        currentPage = page;
        
        document.querySelectorAll('.hero-left a').forEach(el => {
            el.classList.toggle('active', el.dataset.page === page);
        });

        switch(page) {
            case 'dashboard': loadDashboard(); break;
            case 'chat': loadChatIntro(); break;
            case 'settings': loadSettings(); break;
            case 'schedule': loadSchedule(); break;
            case 'profile': 
                openProfileModal();
                loadDashboard();
                break;
            case 'bookings': 
            case 'messages':
            case 'revenue':
                window.location.href = `/guidedata/${page}.html`;
                return;
            default: loadDashboard();
        }
    };

    // ===== ESC 키로 모달 닫기 =====
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeProfileModal();
        }
    });

    // ===== 모달 외부 클릭 시 닫기 =====
    document.getElementById('profileModal')?.addEventListener('click', function(e) {
        if (e.target === this) {
            closeProfileModal();
        }
    });

    // ============================================
    //  PAGE LOADERS
    // ============================================
    function loadDashboard() {
        const name = getUserDisplayName();
        const initial = getUserInitial();
        
        document.getElementById('app').innerHTML = `
            <h1>📊 대시보드</h1>
            <p class="subtitle">가이드 활동을 한눈에 확인하세요</p>

            <div class="user-greeting">
                <div class="avatar">${initial}</div>
                <span>👋 안녕하세요, <strong>${name}</strong>님! 오늘도 좋은 하루 되세요</span>
            </div>

            <div class="card-grid">
                <div class="card" onclick="navigate('schedule')">

    // ===== Logout Handler =====
    window.handleLogout = async function() {
        if (confirm('정말 로그아웃하시겠습니까?')) {
            try {
                await signOut(auth);
                window.location.href = '/login/guidelogin.html';
            } catch (error) {
                alert('로그아웃 중 오류가 발생했습니다: ' + error.message);
            }
        }
    };

    // ============================================
    //  CHAT SYSTEM
    // ============================================
    function getChatBox() {
        return document.getElementById('chatBox');
    }

    function getChatInput() {
        return document.getElementById('chatInput');
    }

    function addMessage(text, sender) {
        const box = getChatBox();
        if (!box) return;

        const emptyMsg = box.querySelector('.chat-empty');
        if (emptyMsg) emptyMsg.remove();

        const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const div = document.createElement('div');
        div.className = `chat-message ${sender}`;
        div.innerHTML = `
            <span class="msg-label">${sender === 'user' ? '👤 You' : '🤖 AI'}</span>
            ${text}
            <span class="timestamp">${time}</span>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    window.quickCommand = function(cmd) {
        const input = getChatInput();
        if (input) {
            input.value = cmd;
            sendChat();
        }
    };

    window.sendChat = function() {
        const input = getChatInput();
        const btn = document.getElementById('sendBtn');
        if (!input) return;

        const text = input.value.trim();
        if (!text) {
            input.focus();
            return;
        }

        addMessage(text, 'user');
        input.value = '';
        input.focus();

        if (btn) btn.disabled = true;

        setTimeout(() => {
            processCommand(text);
            if (btn) btn.disabled = false;
        }, 300);
    };

    function processCommand(text) {
        const lower = text.toLowerCase();

        const commandMap = {
            '프로필': 'profile',
            '내 프로필': 'profile',
            '프로필 보여줘': 'profile',
            '나의 프로필': 'profile',
            '일정': 'schedule',
            '내 일정': 'schedule',
            '일정 보여줘': 'schedule',
            '예약': 'bookings',
            '예약 목록': 'bookings',
            '메시지': 'messages',
            '수익': 'revenue',
            '홈': 'dashboard',
            '대시보드': 'dashboard',
            '메인': 'dashboard',
            '설정': 'settings'
        };

        let matched = false;

        for (const [keyword, page] of Object.entries(commandMap)) {
            if (lower.includes(keyword)) {
                if (['bookings', 'messages', 'revenue'].includes(page)) {
                    addMessage(`📂 "${page}" 페이지로 이동합니다...`, 'ai');
                    setTimeout(() => navigate(page), 500);
                } else {
                    addMessage(`✅ "${page}" 페이지로 이동합니다.`, 'ai');
                    setTimeout(() => navigate(page), 300);
                }
                matched = true;
                break;
            }
        }

        if (!matched) {
            const helpText = `
                죄송합니다. "${text}" 명령을 이해하지 못했어요.<br>
                <strong>사용 가능한 명령어:</strong><br>
                👤 프로필 · 📅 일정 · 📋 예약 · ✉️ 메시지 · 💰 수익 · 🏠 홈
            `;
            addMessage(helpText, 'ai');
        }
    }

    console.log('🚀 Guide Platform initialized');
</script>
