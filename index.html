<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team One Tour</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #333;
        }

        /* header */
        header {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #e5e5e5;
        }

        /* 헤더 내부 컨테이너 */
        .header-container {
            width: 100%;
            max-width: 1200px;
            height: 70px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 왼쪽 로고 */
        .logo img {
            height: 25px;
            display: block;
        }
        
        /* 오른쪽 로그인 버튼 */
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

         
        .login-btn {
            padding: 8px 16px;
            background-color: #0078ff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .login-btn:hover {
            background-color: #005fcc;
        }

        /* Main Section */
        .main {
            text-align: center;
            padding: 40px 20px;
        }

        .main h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .main p.subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .main img {
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .contact {
            font-size: 16px;
            margin-top: 20px;
            color: #444;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<header>
    <div class="header-container">

        <!-- 왼쪽: 로고 + 사이트명 -->
        <div style="display:flex; align-items:center;">
            <a href="#" class="logo">
                <img src="images/logo.png" alt="Team One Tour">
            </a>
         
        /div>

        <!-- 오른쪽: Guide Login 버튼 + Guide Signup 버튼 -->
        <div class="header-right">
            <a href="login/guidelogin.html" class="login-btn">Guide Login</a>
            <a href="login/guidesignup.html" class="login-btn" style="background:#555;">Guide Signup</a>
        </div>    
    
    </div>
</header>

<section class="main">
    <h1>팀원 투어</h1>
    <p class="subtitle">정보는 AI로, 감동은 현지 전문 가이드로</p>

    <img src="images/main-photo.png" alt="Dubai Tour">

    <p class="contact">아랍에미레이트의 여행을 준비하신다면 이메일로 문의 주세요.</p>
</section>

<footer>
    운영 : Team One Tour fz llc - United Arab Emirates<br>
    문의 : Admin@teamonetour.com
</footer>

</body>
</html>
