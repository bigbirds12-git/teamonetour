<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team One Tour</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #333;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid #ddd;
        }

        .logo img {
            height: 50px; /* 로고 크기 조절 */
        }

        .site-name {
            color: #777;
            font-size: 14px;
        }

        /* Main Section */
        .main {
            text-align: center;
            padding: 40px 20px;
        }

        .main h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .main p.subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .main img {
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .contact {
            font-size: 16px;
            margin-top: 20px;
            color: #444;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <!-- 로고 이미지 경로는 GitHub Pages에 올린 후 수정 -->
        <img src="images/logo.png" alt="Team One Tour Logo">
    </div>
    <div class="site-name">Enter site name</div>
</header>

<section class="main">
    <h1>Team One Tour</h1>
    <p class="subtitle">정보는 AI로, 감동은 현지 전문 가이드로</p>

    <img src="images/main-photo.jpg" alt="Dubai Tour">

    <p class="contact">아랍에미레이트의 여행을 준비하신다면 이메일로 문의 주세요.</p>
</section>

<footer>
    운영 : Team One Tour fz llc - United Arab Emirates<br>
    문의 : Admin@teamonetour.com
</footer>

</body>
</html>
