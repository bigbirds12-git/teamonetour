<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team One Tour</title>

    <style>
       body { margin:0; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f7; color:#222; }
    a { text-decoration:none; color:inherit; }
         }

       /* Header */
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 32px;
      background:#ffffff;
      border-bottom:1px solid #e5e5e5;
      position:sticky;
      top:0;
      z-index:10;
    }
    .logo img {
            height: 35px; /* 로고 크기 */
        }
           

        .site-name {
            color: #777;
            font-size: 14px;
        }

        /* Main Section */
        .main {
            text-align: center;
            padding: 40px 20px;
        }

        .main h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .main p.subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .main img {
            width: 90%;
            max-width: 900px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .contact {
            font-size: 16px;
            margin-top: 20px;
            color: #444;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #ddd;
        }
    </style>

    <link rel="icon" href="아이콘파일경로/favicon.png" type="image/x-icon">
</head>






    
<body>

<header>
    <div class="logo">
        <!-- images 폴더 안의 로고 파일 -->

    </div>
    <div class="site-name">Team One Tour</div>
</header>

<section class="main">
    <h1>Team One Tour</h1>
    <p class="subtitle">정보는 AI로, 감동은 현지 전문 가이드로</p>

    <!-- images 폴더 안의 메인 사진 -->
    <img src="images/main-photo.png" alt="Dubai Tour">

    <p class="contact">아랍에미레이트의 여행을 준비하신다면 이메일로 문의 주세요.</p>
</section>

<footer>
